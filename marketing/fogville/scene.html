<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TW = 160, TH = 80;          // iso tile size
const N = 11;                      // grid size
const DURATION = 27.6;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const backOut = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function strHash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
const iso = (i, j) => ({ x: (i - j) * TW / 2, y: (i + j) * TH / 2 });
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(clamp(r * f, 0, 255)); g = Math.round(clamp(g * f, 0, 255)); b = Math.round(clamp(b * f, 0, 255));
  return `rgb(${r},${g},${b})`;
}
function poly(pts, fill, stroke) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- town data ----------
const WALLS = ['#f4d9a6', '#f7b7a3', '#a8d8c8', '#c9b6e4', '#f3e3c3', '#9fc6e8', '#f6c97a', '#e8a0b4', '#b8dba0'];
const ROOFS = ['#d9534f', '#3f6fb5', '#5a4a8a', '#2f8f6a', '#c7663a', '#8a3f5a', '#36506b'];
const isRoad = (i, j) => i === 3 || i === 7 || j === 3 || j === 7;
const HERO = [5, 5], PLOT = [5, 9];
const USER_HOUSES = [[4, 1, '@lena.k'], [5, 1, '@marco_22'], [6, 1, '@sunnyside']];
const NEIGH = [[8, 5, '#41 · @you'], [9, 5, '#42 · @????']];
const tiles = [];
for (let s = 0; s < 2 * N - 1; s++) for (let i = 0; i < N; i++) {
  const j = s - i; if (j < 0 || j >= N) continue;
  const id = i * N + j;
  let kind = 'house';
  if (isRoad(i, j)) kind = 'road';
  else if (i === PLOT[0] && j === PLOT[1]) kind = 'plot';
  else if (hash(id + 7) < 0.14 && !(i === HERO[0] && j === HERO[1])) kind = 'tree';
  if (i === 1 && j === 5) kind = 'fountain';
  // humidity: left side (j>i) humid, right side (i>j) dry
  const hum = clamp(0.55 + (j - i) / 9 + (hash(id + 3) - 0.5) * 0.25);
  tiles.push({ i, j, id, kind, hum,
    wall: WALLS[Math.floor(hash(id) * WALLS.length)], roof: ROOFS[Math.floor(hash(id + 1) * ROOFS.length)],
    h: 52 + hash(id + 2) * 34, pop: hash(id + 5) });
}

// ---------- timeline (from voiceover pauses) ----------
const CUES = [
  { a: 0.00, b: 3.05, text: "I'm giving every follower a window in my town…", hi: 'window' },
  { a: 3.05, b: 5.15, text: "…and it fogs up at YOUR dew point.", hi: 'dew point.' },
  { a: 5.15, b: 6.05, text: 'Humid city?', hi: 'Humid' },
  { a: 6.05, b: 7.35, text: 'Foggy by dinner.', hi: 'Foggy' },
  { a: 7.35, b: 8.25, text: 'Dry city?', hi: 'Dry' },
  { a: 8.25, b: 9.55, text: 'Crystal clear.', hi: 'clear.' },
  { a: 9.55, b: 11.68, text: 'Your username paints your house.', hi: 'username' },
  { a: 11.68, b: 13.15, text: 'No two are the same.', hi: 'same.' },
  { a: 13.15, b: 14.05, text: 'And your neighbour?', hi: 'neighbour?' },
  { a: 14.05, b: 16.15, text: 'Whoever follows right after you.', hi: 'after you.' },
  { a: 16.15, b: 19.18, text: 'Every milestone, the weather gets wilder.', hi: 'wilder.' },
  { a: 19.18, b: 20.17, text: 'Comment “drop”', hi: '“drop”', top: true },
  { a: 20.17, b: 22.72, text: "I'll DM you tonight's condensation risk.", hi: 'condensation risk.', top: true },
  { a: 22.72, b: 25.03, text: 'Window #1 is still clear.', hi: '#1' },
  { a: 25.03, b: 27.6, text: 'Not for long.', hi: 'long.' },
];
// camera keyframes: [time, worldX, worldY, zoom]
const p = (i, j, dy = 0) => { const q = iso(i, j); return [q.x, q.y + dy]; };
const CAM = [
  [0.0, ...p(5, 5, -60), 2.9],
  [2.6, ...p(5, 5, -50), 2.5],
  [3.4, ...p(5, 5, 40), 0.62],
  [5.0, ...p(5, 5, 40), 0.60],
  [5.5, ...p(1, 8, -40), 1.35],
  [7.1, ...p(1.5, 8.5, -40), 1.45],
  [7.7, ...p(8, 1, -40), 1.35],
  [9.3, ...p(8.5, 1.5, -40), 1.45],
  [9.9, ...p(5, 1, -60), 1.75],
  [12.9, ...p(5, 1, -60), 1.85],
  [13.5, ...p(8.5, 5, -60), 2.3],
  [15.9, ...p(8.5, 5, -60), 2.45],
  [16.5, ...p(5, 5, -40), 0.66],
  [19.0, ...p(5, 5, -40), 0.70],
  [22.6, ...p(5, 5, -40), 0.70],
  [23.3, ...p(5, 9, -70), 2.4],
  [27.6, ...p(5, 9, -70), 2.8],
];
function camAt(t) {
  for (let k = 0; k < CAM.length - 1; k++) {
    const A = CAM[k], B = CAM[k + 1];
    if (t <= B[0]) { const u = ease(prog(t, A[0], B[0])); return [lerp(A[1], B[1], u), lerp(A[2], B[2], u), Math.exp(lerp(Math.log(A[3]), Math.log(B[3]), u))]; }
  }
  const L = CAM[CAM.length - 1]; return [L[1], L[2], L[3]];
}

// fog level for a given house at time t
function fogFor(tile, t) {
  if (t < 3.2) return 0;
  const spread = easeOut(prog(t, 3.2, 5.0));
  let f = clamp(tile.hum * 1.25 - 0.15) * spread;
  // during "dry city" segment, keep dry side extra clear; humid side extra foggy
  if (t > 5.1 && t < 9.6) f = tile.hum > 0.55 ? clamp(f + 0.25) : clamp(f - 0.3);
  // username montage: houses keep a gentle shimmer
  if (t > 22.6) f = clamp(f + prog(t, 23, 27) * 0.4);
  return f;
}

// ---------- drawing the town ----------
function drawGround() {
  // big grass diamond
  const a = iso(-0.5, -0.5), b = iso(N - 0.5, -0.5), c = iso(N - 0.5, N - 0.5), d = iso(-0.5, N - 0.5);
  const grad = ctx.createLinearGradient(0, a.y, 0, c.y);
  grad.addColorStop(0, '#8fd16a'); grad.addColorStop(1, '#5fb24a');
  // side thickness
  poly([[d.x, d.y], [c.x, c.y], [c.x, c.y + 60], [d.x, d.y + 60]], '#6e4b2e');
  poly([[c.x, c.y], [b.x, b.y], [b.x, b.y + 60], [c.x, c.y + 60]], '#5a3c24');
  poly([[a.x, a.y], [b.x, b.y], [c.x, c.y], [d.x, d.y]], grad);
}
function tileDiamond(i, j, fill) {
  const q = iso(i, j);
  poly([[q.x, q.y - TH / 2], [q.x + TW / 2, q.y], [q.x, q.y + TH / 2], [q.x - TW / 2, q.y]], fill);
}
function drawRoad(tl) {
  tileDiamond(tl.i, tl.j, '#8b8f99');
  const q = iso(tl.i, tl.j);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 4; ctx.setLineDash([14, 14]);
  ctx.beginPath();
  const vert = tl.i === 3 || tl.i === 7, horiz = tl.j === 3 || tl.j === 7;
  if (vert && !horiz) { ctx.moveTo(q.x - TW / 4, q.y - TH / 4); ctx.lineTo(q.x + TW / 4, q.y + TH / 4); }
  if (horiz && !vert) { ctx.moveTo(q.x + TW / 4, q.y - TH / 4); ctx.lineTo(q.x - TW / 4, q.y + TH / 4); }
  ctx.stroke(); ctx.setLineDash([]);
}
function drawTree(tl, s = 1) {
  const q = iso(tl.i, tl.j);
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(q.x, q.y + 6, 34 * s, 14 * s, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a5230'; ctx.fillRect(q.x - 5 * s, q.y - 30 * s, 10 * s, 34 * s);
  poly([[q.x, q.y - 110 * s], [q.x + 34 * s, q.y - 30 * s], [q.x - 34 * s, q.y - 30 * s]], '#2f8f4e');
  poly([[q.x, q.y - 110 * s], [q.x + 34 * s, q.y - 30 * s], [q.x, q.y - 22 * s]], '#26763f');
}
function drawFountain(tl, t) {
  const q = iso(tl.i, tl.j);
  ctx.fillStyle = '#c9ccd4'; ctx.beginPath(); ctx.ellipse(q.x, q.y, 52, 26, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#5bb8e8'; ctx.beginPath(); ctx.ellipse(q.x, q.y - 4, 40, 19, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8eaee'; ctx.fillRect(q.x - 5, q.y - 40, 10, 36);
  const ph = (t * 3) % 1;
  ctx.fillStyle = `rgba(200,235,255,${1 - ph})`;
  ctx.beginPath(); ctx.arc(q.x, q.y - 44 - ph * 16, 6 + ph * 6, 0, 7); ctx.fill();
}
// house with fog-able window. scale s for pop-in
function drawHouse(tl, t, opts = {}) {
  const q = iso(tl.i, tl.j);
  const s = opts.scale ?? 1;
  if (s <= 0.01) return;
  const wall = opts.wall || tl.wall, roof = opts.roof || tl.roof;
  const hw = TW * 0.34 * s, hh = TH * 0.34 * s, Hh = tl.h * s, rh = 46 * s;
  const L = [q.x - hw, q.y], B = [q.x, q.y + hh], R = [q.x + hw, q.y], T = [q.x, q.y - hh];
  const up = p => [p[0], p[1] - Hh];
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  poly([[B[0] + 6, B[1] + 6], [R[0] + 26, R[1] + 6], [T[0] + 26, T[1] + 6], [L[0] + 6, L[1] + 6]], 'rgba(0,0,0,0.14)');
  // walls
  poly([L, B, up(B), up(L)], shade(wall, 0.86), 'rgba(0,0,0,0.12)');
  poly([B, R, up(R), up(B)], shade(wall, 1.0), 'rgba(0,0,0,0.12)');
  // door on left face
  const dx = lerp(L[0], B[0], 0.55), dy = lerp(L[1], B[1], 0.55);
  poly([[dx - 10 * s, dy - 5 * s], [dx + 10 * s, dy + 5 * s], [dx + 10 * s, dy + 5 * s - 34 * s], [dx - 10 * s, dy - 5 * s - 34 * s]], shade(roof, 0.75));
  // roof (gable along L-R axis)
  const apexL = [lerp(up(L)[0], up(B)[0], 0.5), lerp(up(L)[1], up(B)[1], 0.5) - rh];
  const apexR = [lerp(up(T)[0], up(R)[0], 0.5), lerp(up(T)[1], up(R)[1], 0.5) - rh];
  poly([up(T), up(R), apexR], shade(roof, 0.7));
  poly([up(L), up(B), apexL], shade(wall, 0.8), 'rgba(0,0,0,0.12)');
  poly([up(B), up(R), apexR, apexL], shade(roof, 1.0), 'rgba(0,0,0,0.15)');
  // window on right face
  const u0 = 0.28, u1 = 0.72, v0 = 0.32, v1 = 0.78;
  const fp = (u, v) => [lerp(B[0], R[0], u), lerp(B[1], R[1], u) - Hh * v];
  const win = [fp(u0, v0), fp(u1, v0), fp(u1, v1), fp(u0, v1)];
  poly(win, '#ffffff');
  const inner = [fp(u0 + .03, v0 + .05), fp(u1 - .03, v0 + .05), fp(u1 - .03, v1 - .05), fp(u0 + .03, v1 - .05)];
  const fog = opts.fog ?? 0;
  const glow = opts.glow ?? 0;
  poly(inner, '#3aa6ec');
  // glint
  ctx.save(); ctx.beginPath(); ctx.moveTo(...inner[0]); for (const pt of inner.slice(1)) ctx.lineTo(...pt); ctx.closePath(); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 5 * s;
  ctx.beginPath(); const g0 = fp(u0 + .12, v0 + .1), g1 = fp(u0 + .22, v1 - .1); ctx.moveTo(g0[0], g0[1] - 0); ctx.lineTo(g1[0], g1[1]); ctx.stroke();
  // fog layer
  if (fog > 0) {
    poly(inner, `rgba(240,246,250,${0.98 * fog})`);
    if (fog > 0.45) {
      ctx.strokeStyle = `rgba(90,150,200,${(fog - 0.45) * 1.4})`; ctx.lineWidth = 2.2 * s;
      for (let k = 0; k < 5; k++) {
        const uu = lerp(u0 + .07, u1 - .07, hash(tl.id * 9 + k));
        const len = (0.12 + hash(tl.id * 5 + k) * 0.25) * clamp((fog - 0.45) * 2);
        const a = fp(uu, v1 - .08), b2 = fp(uu, v1 - .08 - len);
        ctx.beginPath(); ctx.moveTo(b2[0], b2[1]); ctx.lineTo(a[0], a[1]); ctx.stroke();
        ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(a[0], a[1], 2.6 * s, 0, 7); ctx.fill();
      }
    }
  }
  ctx.restore();
  // window cross
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3 * s; ctx.beginPath();
  const m0 = fp((u0 + u1) / 2, v0), m1 = fp((u0 + u1) / 2, v1), n0 = fp(u0, (v0 + v1) / 2), n1 = fp(u1, (v0 + v1) / 2);
  ctx.moveTo(...m0); ctx.lineTo(...m1); ctx.moveTo(...n0); ctx.lineTo(...n1); ctx.stroke();
  return { top: [q.x, apexL[1] - 10] };
}
function drawPlot(tl, t) {
  const q = iso(tl.i, tl.j);
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  tileDiamond(tl.i, tl.j, '#d8c49a');
  const on = prog(t, 22.9, 23.4);
  if (on > 0) {
    ctx.save(); ctx.globalAlpha = on;
    const g = ctx.createRadialGradient(q.x, q.y, 4, q.x, q.y, 110);
    g.addColorStop(0, `rgba(255,214,64,${0.75 + pulse * 0.2})`); g.addColorStop(1, 'rgba(255,214,64,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(q.x, q.y, 110, 55, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#ffd640'; ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(q.x, q.y - TH / 2.6); ctx.lineTo(q.x + TW / 2.6, q.y); ctx.lineTo(q.x, q.y + TH / 2.6); ctx.lineTo(q.x - TW / 2.6, q.y); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
}

// ---------- weather (milestones) ----------
function cloud(x, y, s, a, dark) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = dark ? '#7d8796' : '#ffffff';
  for (const [dx, dy, r] of [[-60, 10, 42], [-15, -18, 56], [40, -4, 48], [80, 14, 34], [10, 20, 44]]) {
    ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawWeather(t) {
  const on = prog(t, 16.2, 16.6), off = 1 - prog(t, 19.0, 19.3);
  if (on <= 0 || off <= 0) return;
  const a = on * off;
  const storm = prog(t, 17.6, 17.9);
  const clouds = [[-520, -380, 1.5, 16.25], [80, -470, 1.8, 16.45], [560, -330, 1.4, 16.65], [-200, -200, 1.2, 17.1], [380, -140, 1.3, 17.3]];
  for (const [x, y, s, st] of clouds) {
    const k = backOut(prog(t, st, st + 0.35));
    if (k > 0) cloud(x + Math.sin(t + x) * 20, y, s * k, a, storm > 0.5);
  }
  // rain
  const rain = prog(t, 17.0, 17.3) * a;
  if (rain > 0) {
    ctx.strokeStyle = `rgba(120,180,240,${0.75 * rain})`; ctx.lineWidth = 4;
    for (let k = 0; k < 160; k++) {
      const x = -800 + hash(k) * 1600, sp = 900 + hash(k + 50) * 500;
      const y = -300 + ((t * sp + hash(k + 9) * 1400) % 1400);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 36); ctx.stroke();
    }
  }
  // lightning
  if (t > 17.85 && t < 18.05) {
    ctx.strokeStyle = '#fff6a8'; ctx.lineWidth = 9; ctx.beginPath();
    ctx.moveTo(100, -420); ctx.lineTo(50, -250); ctx.lineTo(120, -250); ctx.lineTo(40, -40); ctx.stroke();
  }
}
function lightningFlash(t) { return (t > 17.85 && t < 18.05) ? 0.45 : (t > 18.12 && t < 18.2 ? 0.25 : 0); }

// ---------- overlays in screen space ----------
function pill(x, y, text, opts = {}) {
  ctx.font = `${opts.weight || 700} ${opts.size || 40}px Inter`;
  const w = ctx.measureText(text).width + 48, h = (opts.size || 40) + 30;
  ctx.save(); ctx.translate(x, y); ctx.scale(opts.scale ?? 1, opts.scale ?? 1);
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = opts.bg || 'rgba(255,255,255,0.96)'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = opts.fg || '#14202e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 2);
  ctx.restore();
}
function wrapLines(text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
function drawCaption(t) {
  const cue = CUES.find(c => t >= c.a && t < c.b); if (!cue) return;
  const k = prog(t, cue.a, cue.a + 0.16);
  const sc = lerp(0.72, 1, backOut(k));
  ctx.save();
  const size = 88;
  ctx.font = `900 ${size}px Inter`;
  const lines = wrapLines(cue.text, 900);
  const cy = cue.top ? 250 : 1330;
  ctx.translate(W / 2, cy); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 3);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  lines.forEach((ln, li) => {
    const y = (li - (lines.length - 1) / 2) * (size * 1.12);
    const total = ctx.measureText(ln).width + (ln.split(' ').length - 1) * 16; let x = -total / 2;
    // split into words for highlight
    const parts = ln.split(' ');
    parts.forEach((wd, wi) => {
      const piece = wd + (wi < parts.length - 1 ? ' ' : '');
      const isHi = cue.hi && cue.hi.split(' ').includes(wd);
      ctx.lineWidth = 16; ctx.strokeStyle = '#0b1220'; ctx.strokeText(piece, x, y);
      ctx.fillStyle = isHi ? '#ffd640' : '#ffffff'; ctx.fillText(piece, x, y);
      x += ctx.measureText(piece).width + (wi < parts.length - 1 ? 16 : 0);
    });
  });
  ctx.restore();
}
function drawTag(t) {
  const a = prog(t, 3.1, 3.4) * (1 - prog(t, 19.0, 19.2));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = '700 38px Inter';
  rrect(48, 92, 330, 66, 33); ctx.fillStyle = 'rgba(11,18,32,0.55)'; ctx.fill();
  ctx.fillStyle = (Math.floor(t * 2) % 2) ? '#ff5a5a' : '#ff8a8a'; ctx.beginPath(); ctx.arc(84, 125, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText('fogville preview', 106, 127);
  ctx.restore();
}
function drawWatermark(t) {
  ctx.save(); ctx.globalAlpha = 0.8;
  ctx.font = '800 34px Inter'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 10;
  ctx.fillText('AirPoint · dew point, decoded', W / 2, H - 90);
  ctx.restore();
}

// phone mockup (comment -> DM)
function drawPhone(t) {
  const inA = prog(t, 19.15, 19.5), outA = 1 - prog(t, 22.55, 22.8);
  const a = Math.min(inA, outA); if (a <= 0) return;
  ctx.save();
  ctx.fillStyle = `rgba(8,14,26,${0.55 * a})`; ctx.fillRect(0, 0, W, H);
  const pw = 760, ph = 1000, px = (W - pw) / 2, py = 420 + (1 - easeOut(inA)) * 400;
  ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
  rrect(px - 18, py - 18, pw + 36, ph + 36, 72); ctx.fillStyle = '#111'; ctx.fill();
  ctx.shadowColor = 'transparent';
  rrect(px, py, pw, ph, 56); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.save(); rrect(px, py, pw, ph, 56); ctx.clip();
  const dm = prog(t, 20.2, 20.45);
  const slide = easeOut(dm) * pw;
  // --- comments view
  ctx.translate(-slide, 0);
  ctx.fillStyle = '#14202e'; ctx.font = '800 40px Inter'; ctx.textAlign = 'center';
  ctx.fillText('Comments', px + pw / 2, py + 90);
  ctx.fillStyle = '#e6e9ee'; ctx.fillRect(px, py + 125, pw, 2);
  const rows = [
    ['airpoint', "Every follower gets a window in my town. Comment “drop” for yours 💧", '#3f6fb5', 19.3],
    ['lena.k', 'drop', '#e8a0b4', 19.55],
    ['marco_22', 'wait… my window fogs at MY dew point??', '#f6c97a', 19.75],
    ['sunnyside', 'drop', '#a8d8c8', 19.95],
  ];
  ctx.textAlign = 'left';
  let y = py + 200;
  for (const [u, txt, col, st] of rows) {
    const k = backOut(prog(t, st, st + 0.25)); if (k <= 0) { y += 150; continue; }
    ctx.save(); ctx.globalAlpha = a * clamp(k); ctx.translate(0, (1 - k) * 30);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px + 70, y, 34, 0, 7); ctx.fill();
    ctx.fillStyle = '#14202e'; ctx.font = '800 32px Inter'; ctx.fillText(u, px + 125, y - 18);
    ctx.font = '500 32px Inter'; ctx.fillStyle = '#2b3645';
    const lines = wrapLines(txt, pw - 170); lines.forEach((ln, li) => ctx.fillText(ln, px + 125, y + 24 + li * 40));
    ctx.restore();
    y += 110 + lines.length * 40;
  }
  // --- DM view
  ctx.translate(pw, 0);
  ctx.fillStyle = '#14202e'; ctx.font = '800 40px Inter'; ctx.textAlign = 'center';
  ctx.fillText('airpoint', px + pw / 2, py + 90);
  ctx.fillStyle = '#e6e9ee'; ctx.fillRect(px, py + 125, pw, 2);
  ctx.textAlign = 'left';
  const bub = (x, yy, w, lines, bg, fg, st, align) => {
    const k = backOut(prog(t, st, st + 0.25)); if (k <= 0) return 0;
    const h = 36 + lines.length * 42;
    ctx.save(); ctx.globalAlpha = a * clamp(k);
    const bx = align === 'r' ? px + pw - 40 - w : px + 40;
    ctx.translate(bx + w / 2, yy + h / 2); ctx.scale(k, k); ctx.translate(-(bx + w / 2), -(yy + h / 2));
    rrect(bx, yy, w, h, 30); ctx.fillStyle = bg; ctx.fill();
    ctx.fillStyle = fg; ctx.font = '600 32px Inter';
    lines.forEach((ln, li) => ctx.fillText(ln, bx + 28, yy + 52 + li * 42));
    ctx.restore(); return h;
  };
  let yy = py + 180;
  yy += bub(0, yy, 560, ['Hey! 💧 Your window in', 'Fogville is ready.'], '#eef1f5', '#14202e', 20.5, 'l') + 24;
  yy += bub(0, yy, 330, ['See my window'], '#3f6fb5', '#ffffff', 20.95, 'r') + 24;
  yy += bub(0, yy, 600, ['Tonight in your city:', 'condensation risk: HIGH', 'Windows fog below 11°C.'], '#eef1f5', '#14202e', 21.45, 'l') + 24;
  bub(0, yy, 560, ["You're window #1 on", "Founders' Street 🏠"], '#eef1f5', '#14202e', 21.95, 'l');
  ctx.restore();
  ctx.restore();
}

// pin over the empty plot (world space)
function drawPin(t) {
  const k = backOut(prog(t, 23.1, 23.5)); if (k <= 0) return;
  const q = iso(PLOT[0], PLOT[1]);
  const bob = Math.sin(t * 4) * 6;
  ctx.save(); ctx.translate(q.x, q.y - 70 + bob); ctx.scale(k * 0.5, k * 0.5);
  // pin
  ctx.fillStyle = '#ffd640'; ctx.strokeStyle = '#0b1220'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0, -60, 44, Math.PI, 0); ctx.lineTo(0, 30); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#0b1220'; ctx.beginPath(); ctx.arc(0, -60, 16, 0, 7); ctx.fill();
  ctx.restore();
  // label
  ctx.save(); ctx.translate(q.x, q.y - 150 + bob); ctx.scale(0.5, 0.5);
  pill(0, 0, '@??? · Window #1', { scale: k, size: 44, weight: 800 });
  ctx.restore();
}
// creeping fog vignette (screen space)
function fogVignette(t) {
  const f = prog(t, 23.2, 27.4); if (f <= 0) return;
  const g = ctx.createRadialGradient(W / 2, H * 0.45, lerp(1100, 420, ease(f)), W / 2, H * 0.45, 1300);
  g.addColorStop(0, 'rgba(235,242,248,0)'); g.addColorStop(0.55, `rgba(235,242,248,${0.35 * f})`); g.addColorStop(1, `rgba(235,242,248,${f})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- frame ----------
function renderFrame(t) {
  // sky: day -> dusk as the night (and fog) arrives
  const dusk = prog(t, 3.0, 9.5) * 0.6 + prog(t, 22.6, 27) * 0.4;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `rgb(${lerp(120, 64, dusk)},${lerp(196, 92, dusk)},${lerp(255, 170, dusk)})`);
  sky.addColorStop(1, `rgb(${lerp(206, 250, dusk)},${lerp(236, 190, dusk)},${lerp(255, 170, dusk)})`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  const [cx, cy, z] = camAt(t);
  ctx.save();
  ctx.translate(W / 2, H * 0.47); ctx.scale(z, z); ctx.translate(-cx, -cy);
  drawGround();
  for (const tl of tiles) if (tl.kind === 'road') drawRoad(tl);
  for (const tl of tiles) if (tl.kind === 'plot') drawPlot(tl, t);
  for (const tl of tiles) {
    if (tl.kind === 'tree') drawTree(tl, 1);
    else if (tl.kind === 'fountain') drawFountain(tl, t);
    else if (tl.kind === 'house') {
      const opts = { fog: fogFor(tl, t) };
      // pop-in during zoom-out
      if (t < 3.6 && !(tl.i === HERO[0] && tl.j === HERO[1])) opts.scale = backOut(prog(t, 2.9 + tl.pop * 0.5, 3.25 + tl.pop * 0.5));
      // username montage: recolor by typed username
      const uh = USER_HOUSES.find(u => u[0] === tl.i && u[1] === tl.j);
      if (uh) {
        const idx = USER_HOUSES.indexOf(uh), st = 9.7 + idx * 0.75;
        const typed = prog(t, st, st + 0.45);
        if (typed >= 1) { const h = strHash(uh[2]); opts.wall = WALLS[h % WALLS.length]; opts.roof = ROOFS[(h >> 4) % ROOFS.length]; }
        if (t > st + 0.45 && t < st + 0.7) opts.scale = lerp(1.18, 1, prog(t, st + 0.45, st + 0.7));
      }
      // hero house glows warm at the start
      if (tl.i === HERO[0] && tl.j === HERO[1] && t < 3.2) opts.glow = 0;
      drawHouse(tl, t, opts);
    }
  }
  // drifting mist over foggy houses
  for (const tl of tiles) {
    if (tl.kind !== 'house') continue;
    const f = fogFor(tl, t); if (f < 0.35) continue;
    const q = iso(tl.i, tl.j);
    const mx = q.x + Math.sin(t * 0.8 + tl.id) * 30, my = q.y - 50;
    const g = ctx.createRadialGradient(mx, my, 5, mx, my, 130);
    g.addColorStop(0, `rgba(245,248,252,${(f - 0.35) * 0.75})`); g.addColorStop(1, 'rgba(245,248,252,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(mx, my, 130, 80, 0, 0, 7); ctx.fill();
  }
  // world-space labels
  if (t > 5.2 && t < 9.6) {
    const humid = t < 7.35;
    const q = humid ? iso(1.2, 8.2) : iso(8.2, 1.2);
    const st = humid ? 5.2 : 7.4;
    ctx.save(); ctx.translate(q.x, q.y - 200); ctx.scale(0.75, 0.75);
    pill(0, 0, humid ? 'humid city · dew point 22°C' : 'dry city · dew point −3°C', { scale: backOut(prog(t, st, st + 0.3)), size: 44, weight: 800, bg: humid ? '#ffffff' : '#ffffff', fg: humid ? '#1e5fa8' : '#b8651b' });
    ctx.restore();
  }
  if (t > 9.6 && t < 13.2) {
    USER_HOUSES.forEach(([i, j, name], idx) => {
      const st = 9.7 + idx * 0.75; const k = backOut(prog(t, st - 0.1, st + 0.15)); if (k <= 0) return;
      const q = iso(i, j); const chars = Math.floor(prog(t, st, st + 0.45) * name.length);
      ctx.save(); ctx.translate(q.x, q.y - 140 - (idx % 2) * 85); ctx.scale(0.5, 0.5);
      pill(0, 0, (name.slice(0, Math.max(1, chars)) + (chars < name.length && Math.floor(t * 6) % 2 ? '|' : '')), { scale: k, size: 46, weight: 800 });
      ctx.restore();
    });
  }
  if (t > 13.2 && t < 16.2) {
    NEIGH.forEach(([i, j, label], idx) => {
      const st = idx === 0 ? 13.25 : 14.1; const k = backOut(prog(t, st, st + 0.3)); if (k <= 0) return;
      const q = iso(i, j);
      ctx.save(); ctx.translate(q.x, q.y - 135); ctx.scale(0.45, 0.45);
      pill(0, 0, label, { scale: k, size: 48, weight: 800, bg: idx === 0 ? '#ffd640' : '#ffffff' });
      ctx.restore();
    });
  }
  drawWeather(t);
  drawPin(t);
  ctx.restore();

  const fl = lightningFlash(t);
  if (fl) { ctx.fillStyle = `rgba(255,255,240,${fl})`; ctx.fillRect(0, 0, W, H); }
  fogVignette(t);
  drawTag(t);
  if (t > 16.4 && t < 19.2) {
    const badges = [['1K followers → rain', 16.5], ['10K → storms', 17.5], ['100K → fog season', 18.3]];
    badges.forEach(([b, st], k) => {
      const s = backOut(prog(t, st, st + 0.3)); if (s <= 0) return;
      pill(W / 2, 560 + k * 130, b, { scale: s * 1.3, size: 48, weight: 800, bg: '#0b1220', fg: '#ffffff' });
    });
  }
  drawPhone(t);
  drawCaption(t);
  drawWatermark(t);
}
window.renderFrame = renderFrame;
window.DURATION = DURATION;
window.CUES = CUES;
renderFrame(0);
</script>
