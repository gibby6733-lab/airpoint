<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Fredoka;src:url(../../vendor/Fredoka.ttf)}html,body{margin:0;background:#000}</style></head><body><script type="module">
import { THREE, W, H, setup, bakeEnv, skyDome, mat, mesh, SPH, txt } from '../../lib.js';
import { BUILD, act } from '../cast.js';
const B = await (await fetch('../bible.json')).json();
const { r, scene, cam, octx } = setup();
scene.add(skyDome('#ffe9f3', '#fff8e8')); scene.environment = bakeEnv(r, '#fff0f6', '#f0fff4', '#ffffff');
scene.add(new THREE.HemisphereLight('#ffffff', '#ffe0ec', 1.2)); const key = new THREE.DirectionalLight('#fff4e6', 2.6); key.position.set(4, 8, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(key);
const rim = new THREE.DirectionalLight('#cfe8ff', 1.4); rim.position.set(-5, 4, -6); scene.add(rim);
mesh(new THREE.CircleGeometry(30, 64), mat('#fde2ec', { rough: .9 }), 0, 0, 0, scene, { r: [-Math.PI / 2, 0, 0], cast: false });
const ids = ['rosie', 'pudding', 'ollie', 'clover', 'ziggy'], rigs = {}; ids.forEach(id => { rigs[id] = BUILD[id](); scene.add(rigs[id].root); });
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tc = tmp.getContext('2d');
function shot(pos, tgt, cb) { cam.position.set(...pos); cam.lookAt(...tgt); cam.updateProjectionMatrix(); r.render(scene, cam); tc.clearRect(0, 0, W, H); tc.drawImage(r.domElement, 0, 0); }
function only(id) { ids.forEach(k => rigs[k].root.visible = k === id || id === '*'); }
const EX = [['happy', 'HAPPY'], ['laugh', 'LAUGH'], ['surprised', 'SURPRISED'], ['nervous', 'NERVOUS'], ['thinking', 'THINKING'], ['determined', 'READY!']];
window.ready = document.fonts.load('700 80px Fredoka'); window.setTimeline = () => {};
window.renderFrame = function (t) {
  const i = Math.round(t), c = octx; c.fillStyle = '#fff6fa'; c.fillRect(0, 0, W, H);
  if (i === 0) { // lineup
    only('*'); ids.forEach((id, k) => { const R = rigs[id]; R.root.position.set((k - 2) * 1.95, 0, k % 2 ? -1.2 : .4); R.root.rotation.y = 0; act(R, { t: 1.3 + k, expr: 'happy', arms: k === 4 ? 'cheer' : null, wave: k === 0 }); });
    cam.fov = 40; shot([0, 3.6, 24], [0, 2.6, 0]); c.drawImage(tmp, 0, 0);
    c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.roundRect(90, 120, 900, 230, 50); c.fill(); txt(c, 'WONDERBUDS', W / 2, 205, 130, '#ff6b6b', { stroke: 18, sc: '#ffffff' }); txt(c, 'MEET THE FIVE BEST FRIENDS', W / 2, 300, 50, '#4dabf7');
    const NX = [150, 345, 540, 735, 930], NC = { clover: '#3fb68f' }; ids.forEach((id, k) => { const ch = B.characters[id]; txt(c, ch.name.toUpperCase(), NX[k], 1430 + (k % 2) * 110, 50, NC[id] || Object.values(ch.colors)[0], { stroke: 12, sc: '#ffffff' }); txt(c, ch.role.replace('The ', ''), NX[k], 1480 + (k % 2) * 110, 30, '#555', { stroke: 6, sc: '#ffffff' }); });
    return; }
  const id = ids[i - 1], R = rigs[id], ch = B.characters[id]; only(id); R.root.position.set(0, 0, 0);
  c.fillStyle = Object.values(ch.colors)[0]; c.fillRect(0, 0, W, 190); txt(c, `${ch.name.toUpperCase()} THE ${ch.species.toUpperCase()}`, W / 2, 80, 76, '#ffffff', { stroke: 12, maxW: 1000 }); txt(c, ch.role.toUpperCase() + ` · HEIGHT ${ch.height}`, W / 2, 150, 40, '#ffffff', { stroke: 8 });
  // turnaround: front / side / back
  ['FRONT', 'SIDE', 'BACK'].forEach((lab, k) => { R.root.rotation.y = [0, Math.PI / 2, Math.PI][k]; act(R, { t: 1.4, expr: 'happy' }); cam.fov = 30; shot([0, 1.9, 11.5], [0, 1.75, 0]); c.drawImage(tmp, 180, 380, 720, 1280, k * 360, 200, 360, 640); txt(c, lab, k * 360 + 180, 815, 38, '#888'); });
  // expressions (head close-ups)
  R.root.rotation.y = 0;
  EX.forEach(([ex, lab], k) => { act(R, { t: 2.2, expr: ex, chinTap: ex === 'thinking', excited: ex === 'laugh' }); const hy = R.head.getWorldPosition(new THREE.Vector3()).y; cam.fov = 30; shot([0, hy + .25, 9.5], [0, hy + .05, 0]);
    const x = (k % 2) * 540, y = 860 + Math.floor(k / 2) * 310; c.drawImage(tmp, 0, 648, 1080, 624, x + 10, y, 520, 300); c.lineWidth = 6; c.strokeStyle = '#ffffff'; c.strokeRect(x + 10, y, 520, 300); txt(c, lab, x + 30, y + 36, 32, '#ffffff', { stroke: 9, sc: '#333', align: 'left' }); });
  // colour swatches
  Object.entries(ch.colors).filter(([, v]) => v.startsWith('#')).forEach(([k, v], j) => { c.fillStyle = v; c.beginPath(); c.arc(80 + j * 150, 1830, 30, 0, 7); c.fill(); c.strokeStyle = '#ccc'; c.lineWidth = 3; c.stroke(); txt(c, v, 80 + j * 150, 1885, 22, '#666'); });
};
</script></body></html>
