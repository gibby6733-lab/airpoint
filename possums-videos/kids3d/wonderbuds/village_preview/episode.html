<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Fredoka;src:url(../../vendor/Fredoka.ttf)}html,body{margin:0;background:#000}</style></head><body><script type="module">
import { THREE, setup } from '../../lib.js';
import { buildVillage, SPOTS } from '../village.js';
import { BUILD, act } from '../cast.js';
await document.fonts.load('700 80px Fredoka');
const { r, scene, cam, octx } = setup(1920, 1080); cam.fov = 35; cam.updateProjectionMatrix();
const V = buildVillage(scene, r);
const C = {}; const at = { rosie: [0, 2.6, 2.9], pudding: [SPOTS.bakery[0] - .5, 0, SPOTS.bakery[1] + 4.2], ollie: [.6, 5.4, SPOTS.treehouse[1] + 1.8], clover: [SPOTS.garden[0], 0, SPOTS.garden[1] + 1.2], ziggy: [SPOTS.playground[0] + .5, 0, SPOTS.playground[1] + 1] };
for (const id of Object.keys(BUILD)) { C[id] = BUILD[id](); scene.add(C[id].root); C[id].root.position.set(...at[id]); }
C.rosie.root.position.y = .72;
const shots = [[[0, 38, 70], [0, 0, -5]], [[0, 9, 34], [0, 3, 0]], [[3, 3.4, 11], [0, 2, 1.5]], [[SPOTS.bakery[0] - 1, 3.5, SPOTS.bakery[1] + 14], [SPOTS.bakery[0], 2.6, SPOTS.bakery[1]]], [[3, 8, SPOTS.treehouse[1] + 13], [0, 6.5, SPOTS.treehouse[1]]], [[SPOTS.garden[0] + 2, 3.5, SPOTS.garden[1] + 12], [SPOTS.garden[0], 1.6, SPOTS.garden[1]]], [[SPOTS.playground[0] - 2, 4, SPOTS.playground[1] + 13], [SPOTS.playground[0], 2.5, SPOTS.playground[1]]], [[-6, 4, -30], [-6, 2, -45]]];
window.ready = Promise.resolve(); window.setTimeline = () => {};
window.renderFrame = function (t) { const i = Math.round(t); V.update(3 + i); for (const id in C) act(C[id], { t: 2 + i, expr: 'happy' }); const [p, g] = shots[i]; cam.position.set(...p); cam.lookAt(...g); r.render(scene, cam); octx.drawImage(r.domElement, 0, 0); };
</script></body></html>
