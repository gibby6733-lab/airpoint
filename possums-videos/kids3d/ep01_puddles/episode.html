// ground with soft color variation

// house, fence, trees, bushes

// mushrooms + stepping stones + mailbox
const R0 = rng(21); for (let i = 0; i < 14; i++) { const x = -2 + R0() * 64, z = 2 + R0() * 4; if (inPuddle(x, z, .5)) continue; const g = group(scene, x, 0, z); g.scale.setScalar(.6 + R0() * .5); mesh(new THREE.CylinderGeometry(.12, .16, .4, 12), mat('#fff3e0'), 0, .2, 0, g); mesh(SPH(.32, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat('#ff4a4a', { kind: 'gloss' }), 0, .38, 0, g); for (let k = 0; k < 4; k++) mesh(SPH(.05, 8, 6), mat('#ffffff'), Math.cos(k * 1.6) * .2, .55, Math.sin(k * 1.6) * .2, g, { cast: false }); }
for (let n = 0; n < 10; n++) { const x0 = n ? X(n) + RAD(n) : -1, x1 = X(n + 1) - RAD(n + 1); for (let k = 1; k <= 2; k++) { const x = lerp(x0, x1, k / 3); mesh(SPH(.42, 20, 10), mat('#d9cbb2', { rough: .9 }), x, .02, lerp(Z(Math.max(1, n)), Z(n + 1), k / 3) + (k % 2 ? .25 : -.25), scene, { s: [1, .18, .75] }); } }
{ const g = group(scene, -2.2, 0, -3.2); mesh(new THREE.CylinderGeometry(.07, .07, 1.3, 8), mat('#8a5a33'), 0, .65, 0, g); mesh(new THREE.BoxGeometry(.5, .45, .8), mat('#4dabf7', { kind: 'gloss' }), 0, 1.45, 0, g); mesh(new THREE.BoxGeometry(.04, .3, .1), mat('#ff4a4a'), .27, 1.65, .2, g); }
// puddles (+ wet darker rim) and number signs

// clouds

// characters

// rain

const CROWNS = 16, crownGeo = new THREE.CylinderGeometry(1, .8, 1, 40, 1, true), crowns = Array.from({ length: CROWNS }, () => { const m = mesh(crownGeo, new THREE.MeshPhysicalMaterial({ color: '#bfe6ff', transparent: true, opacity: .6, roughness: .05, side: THREE.DoubleSide, depthWrite: false }), 0, -10, 0, scene, { cast: false }); return m; });

// ---------------------------------------------------------------- timeline-derived events (computed once)
let EV = null;
function lineBy(f) { return TL.lines.find(f); }
function build() {
  const jumps = { pip: [], bo: [], dot: [] }, splashes = [], sparkEv = [];
  const door = lineBy(l => l.beat === 'door'), dress = lineBy(l => l.beat === 'dress');
  const outT = door.start + .35, landT = wordT(door, 'puddle');

  jumps.pip.push({ t0: landT + .35, t1: dress.start - .05, a: [-3.6, -1.6], b: [0, 0], h: .5, walk: true, yaw: .6 });
  let pip = [0, 0], bo = null, dot = null;
  for (const L of TL.lines) {
    if (L.beat !== 'jump') continue; const n = L.n, land = sfxT(L, 'splash') ?? sfxT(L, 'bigsplash'); let take = sfxT(L, 'boing') ?? land - .7; if (land - take < .45) take = land - .55;

    else if (bo) { jumps.bo.push({ t0: take + .1, t1: land + .1, a: bo, b: [X(n) + off, Z(n) + .75], h: h * .8, spin, yaw: .9 }); bo = [X(n) + off, Z(n) + .75]; splashes.push({ t: land + .1, x: bo[0], z: bo[1], s: sup ? 1.4 : .55 }); }

    else if (dot) { jumps.dot.push({ t0: take + .18, t1: land + .16, a: dot, b: [X(n) - off, Z(n) + .8], h: h * .75, spin, yaw: .9 }); dot = [X(n) - off, Z(n) + .8]; splashes.push({ t: land + .16, x: dot[0], z: dot[1], s: sup ? 1.4 : .6 }); }

// position of a character at time t from its jump list
function track(list, t, start) {
  let pos = start, st = { y: 0, squash: 0, spin: 0, air: false, yaw: .25, walk: false, landedAt: -9, u: 0 };
  for (const j of list) {
    if (t < j.t0 - (j.crouch ?? .2)) break;
    if (t < j.t0) { const k = seg(t, j.t0 - (j.crouch ?? .2), j.t0); pos = j.a; st.squash = j.walk ? 0 : Math.sin(k * Math.PI / 2) * (j.crouch ?? .25) * .7; st.yaw = lerp(st.yaw, j.yaw, k); break; }
    if (t < j.t1) { const u = (t - j.t0) / (j.t1 - j.t0); const e = j.walk ? u : u; pos = [lerp(j.a[0], j.b[0], e), lerp(j.a[1], j.b[1], e)]; st.y = 4 * j.h * u * (1 - u); st.air = !j.walk; st.walk = !!j.walk; st.u = u;
      st.squash = j.walk ? 0 : (u < .15 ? -.12 * (1 - u / .15) : u > .85 ? .06 : -.08); st.spin = j.spin ? u * Math.PI * 2 : 0; st.yaw = j.yaw; st.waddle = j.waddle; break; }

// ---------------------------------------------------------------- camera
function curLine(t) { let i = 0; for (let j = 0; j < TL.lines.length; j++) if (t >= TL.lines[j].start - .2) i = j; return i; }
function camFor(i, t, P) {
  const L = TL.lines[i], u = clamp((t - L.start) / (L.end - L.start + .4)), b = L.beat, px = P.pos[0], pz = P.pos[1];
  let pos, tgt;
  if (b === 'intro') { pos = [lerp(10, 2, eInOut(u)), lerp(9, 4.2, eInOut(u)), lerp(24, 11, eInOut(u))]; tgt = [-4, 2.4, -5]; }
  else if (b === 'door') { pos = [lerp(1, 2.5, u), 2.6, lerp(6, 5, u)]; tgt = [lerp(-5.5, -2, eInOut(u)), 1.7, lerp(-4.5, -1.5, u)]; }
  else if (b === 'dress') { const a = lerp(-.25, .3, u); pos = [Math.sin(a) * 8.6, 2.6, Math.cos(a) * 8.6]; tgt = [0, 1.85, 0]; }
  else if (b === 'path') { pos = [lerp(4, 22, eInOut(u)), lerp(10, 14, u), lerp(18, 26, u)]; tgt = [lerp(12, 30, eInOut(u)), 0, 0]; }
  else if (b === 'chorus') { pos = [px + 1.2, 3.0, pz + 11]; tgt = [px + .3, 2.0, pz]; }
  else if (b === 'friend_talk') { const F = L.who === 'bo' ? P.bo : P.dot; pos = [F.pos[0] + .6, 2.0, F.pos[1] + 6.4]; tgt = [F.pos[0] - .3, 1.3, F.pos[1]]; }
  else if (b === 'big') { const k = eInOut(seg(u, 0, .55)), uh = seg(t, wordT(L, 'uh') - .1, wordT(L, 'uh') + .3); pos = [lerp(px + 2, X(10) - 1, k), lerp(2.6, 9, k), lerp(pz + 8, 17, k)]; tgt = [lerp(px, X(10), k), lerp(1.4, 0, k), 0];
    if (uh > 0) { const c = eOut(uh); pos = [lerp(pos[0], px + .6, c), lerp(pos[1], 2.9, c), lerp(pos[2], pz + 5.2, c)]; tgt = [lerp(tgt[0], px, c), lerp(tgt[1], 2.2, c), lerp(tgt[2], pz, c)]; } }
  else if (b === 'jump' && L.super) { const k = clamp(P.u || 0); pos = [X(10) - 6, lerp(1.3, 3.5, k), 10]; tgt = [lerp(px, X(10), .5), 1.5 + P.y * .6, 0]; if (t > EV.splashes.find(s => s.s > 3).t) { const w = eOut(seg(t, EV.splashes.find(s => s.s > 3).t, L.end + .4)); pos = [lerp(X(10) - 6, X(10) + 1, w), lerp(3.5, 4.5, w), lerp(10, 14, w)]; tgt = [X(10), 1.2, 0]; } }
  else if (b === 'jump') { pos = [px + 2.4, 3.4, 13]; tgt = [px + .9, 2.3 + P.y * .4, pz * .5]; }
  else if (b === 'wet' || b === 'shake') { pos = [X(10) + .3, 2.8, 9.6]; tgt = [X(10), 1.8, Z(10)]; }
  else if (b === 'rainbow') { const k = eInOut(u); pos = [lerp(X(10), X(10) - 4, k), lerp(2.2, 1.6, k), lerp(7, 12, k)]; tgt = [lerp(X(10), 34, k), lerp(1.8, 16, k), lerp(0, -40, k)]; pos[1] = lerp(2.4, 3.2, k); }
  else if (b === 'recap') { const k = eInOut(u); const cx = lerp(X(1) - 2, X(10) + 2, k); pos = [cx, 6.5, 13]; tgt = [cx + 2, .4, -1]; }
  else { pos = [X(10) + .4, 3.0, 11.2]; tgt = [X(10), 2.0, Z(10)]; }

}
function camAt(t, P) {
  const i = curLine(t); let [p, g] = camFor(i, t, P);
  const L = TL.lines[i]; if (i > 0) { const k = eInOut(clamp((t - (L.start - .2)) / .8)); if (k < 1) { const [p0, g0] = camFor(i - 1, t, P); p = p.map((v, j) => lerp(p0[j], v, k)); g = g.map((v, j) => lerp(g0[j], v, k)); } }

  let sh = 0; for (const s of EV.splashes) { const d = t - s.t; if (d > 0 && d < .5) sh += .06 * s.s * Math.exp(-d * 9); }
  cam.position.set(p[0] + Math.sin(t * 1.1) * .05 + Math.sin(t * 47) * sh, p[1] + Math.sin(t * .9) * .04 + Math.cos(t * 43) * sh, p[2]); cam.lookAt(g[0], g[1], g[2]);
  return g;
}

// ---------------------------------------------------------------- frame
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S3 = new THREE.Vector3(), E = new THREE.Euler();
const cRain = new THREE.Color('#c9d6e6'), cSun = new THREE.Color('#d8eefc'), cl1 = new THREE.Color('#b9c2cf'), cl2 = new THREE.Color('#ffffff'), sunC1 = new THREE.Color('#e3ebff'), sunC2 = new THREE.Color('#fff0d4');
window.setTimeline = tl => { TL = tl; build(); };
window.ready = (async () => { await document.fonts.load('700 80px Fredoka'); })();
window.renderFrame = function (t) {
  const rf = 1 - eInOut(seg(t, EV.rainEnd, EV.rainEnd + 1.4)), sunny = 1 - rf;
  // characters
  const P = track(EV.jumps.pip, t, [-6, -5.6]); const B = track(EV.jumps.bo, t, [X(5) + 3, Z(5) - 2.2]); const D = track(EV.jumps.dot, t, [X(7) + 6, Z(7) - 3]);
  P.bo = B; P.dot = D;
  const Li = TL.lines[curLine(t)], beat = Li.beat;
