<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Mafia story renderer: Ken Burns on the user's images, paper-cut transitions, noir grade, captions.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
let TL = null; const IMG = {};
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k, seg = (u, a, b) => clamp((u - a) / (b - a));
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, eOut = k => 1 - Math.pow(1 - k, 3);
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

window.setTimeline = tl => { TL = tl; };
window.whenReady = () => Promise.all(TL.images.map(f => new Promise((res, rej) => { const im = new Image(); im.onload = () => { IMG[f] = im; res(); }; im.onerror = rej; im.src = (window.IMG_DATA && IMG_DATA[f]) || ('images/' + f); })));

// ---- one shot: image covering the frame, slow push/pan (direction varies per shot)
function drawShot(i, t) {
  const s = TL.shots[i], im = IMG[s.img]; if (!im) return;
  const k = clamp((t - s.start) / Math.max(.1, s.end - s.start));
  const r = rng(i * 7 + 3), dir = i % 4, z0 = 1.06, z1 = 1.2;
  const zoom = dir === 3 ? lerp(z1, z0, eInOut(k)) : lerp(z0, z1, eInOut(k));   // every 4th shot pulls out
  const wide = im.width / im.height > .8;  // landscape/square: show the whole picture over a blurred fill
  const base = (wide ? (W / im.width) * 1.03 : Math.max(W / im.width, H / im.height)) * zoom;
  const w = im.width * base, h = im.height * base;
  const px = [[-.5, .5], [.5, -.5], [0, 0], [-.3, .3]][dir], py = [[.3, -.3], [-.2, .2], [.5, -.5], [0, 0]][dir];
  const x = (W - w) / 2 + lerp(px[0], px[1], eInOut(k)) * (w - W) / 2, y = (H - h) / 2 + (h > H ? lerp(py[0], py[1], eInOut(k)) * (h - H) / 2 : lerp(-30, 30, eInOut(k)) * (dir % 2 ? 1 : -1));
  // blurred fill behind (for images narrower than 9:16 after zoom)
  ctx.save(); ctx.filter = 'blur(30px) brightness(.5)'; const b2 = Math.max(W / im.width, H / im.height) * 1.3;
  ctx.drawImage(im, (W - im.width * b2) / 2, (H - im.height * b2) / 2, im.width * b2, im.height * b2); ctx.restore();
  ctx.save(); if (h < H) { ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 50; } ctx.filter = 'contrast(1.12) saturate(.78) sepia(.18)'; ctx.drawImage(im, x, y, w, h); ctx.restore();
}
// ---- jagged torn edge along a line; returns polygon points for the revealed side
function tornPoly(kind, p, seed) {
  const r = rng(seed), pts = [], n = 46, jag = 26;
  if (kind === 'tear_h') { const x = lerp(-80, W + 80, p); for (let i = 0; i <= n; i++) { const y = i / n * H; pts.push([x + (r() - .5) * jag + Math.sin(i * 1.7) * 10, y]); } return { edge: pts, fill: [[-10, H], [-10, 0]] }; }
  if (kind === 'tear_v') { const y = lerp(-80, H + 80, p); for (let i = 0; i <= n; i++) { const x = i / n * W; pts.push([x, y + (r() - .5) * jag + Math.sin(i * 1.3) * 12]); } return { edge: pts, fill: [[W, -10], [0, -10]] }; }
  // diagonal
  const o = lerp(-H * .6, W + H * .6, p);
  for (let i = 0; i <= n; i++) { const y = i / n * (H + 200) - 100, x = o - y * .45; pts.push([x + (r() - .5) * jag, y]); }
  return { edge: pts, fill: [[-W, H + 100], [-W, -100]] };
}
function paperEdge(pts, t) {
  ctx.save(); ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 24; ctx.strokeStyle = '#efe6d2'; ctx.lineWidth = 22;
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#d8ccb2'; ctx.lineWidth = 6; ctx.stroke();
  ctx.restore();
}
function drawTransition(tr, a, b, t) {
  const p = eInOut(clamp((t - (tr.t - tr.dur / 2)) / tr.dur));
  drawShot(a, t);
  if (tr.kind === 'cutout') { // incoming image as a paper cut-out card that slaps down and grows to full frame
    const s = lerp(.55, 1, eOut(p)), rot = lerp(-.12, 0, eOut(p)), r = rng(Math.round(tr.t * 100));
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(rot); ctx.scale(s, s);
    ctx.beginPath(); const n = 60; for (let i = 0; i < n; i++) { const ang = i / n * 6.283; const rx = W / 2 + 10, ry = H / 2 + 10;
      const cx = Math.cos(ang), cy = Math.sin(ang), m = 1 / Math.max(Math.abs(cx) / rx, Math.abs(cy) / ry); const j = (r() - .5) * 18;
      ctx.lineTo(cx * (m + j), cy * (m + j)); } ctx.closePath();
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 40; ctx.fillStyle = '#efe6d2'; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.clip(); ctx.translate(-W / 2, -H / 2); drawShot(b, t); ctx.restore();
    return;
  }
  const { edge, fill } = tornPoly(tr.kind, p, Math.round(tr.t * 100));
  ctx.save(); ctx.beginPath(); edge.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); fill.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.closePath(); ctx.clip();
  drawShot(b, t); ctx.restore();
  if (p > 0 && p < 1) paperEdge(edge, t);
}
function grade(t) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = rng(Math.floor(t * 24)); ctx.fillStyle = 'rgba(255,255,255,.035)';
  for (let i = 0; i < 260; i++) ctx.fillRect(r() * W, r() * H, 2, 2);                       // film grain
  if (r() > .93) { ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(r() * W, 0, 2, H); } // occasional scratch
}
function captions(t) {
  const B = TL.beats.find(b => t >= b.start - .05 && t <= b.end + .3); if (!B || !B.words.length) return;
  const ws = B.words; let ci = ws.findIndex((w, i) => t >= w.s && (i === ws.length - 1 || t < ws[i + 1].s)); if (ci < 0) ci = 0;
  const CH = 4, c0 = Math.floor(ci / CH) * CH, chunk = ws.slice(c0, c0 + CH);
  ctx.save(); ctx.font = `700 70px 'DejaVu Serif', serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const line = chunk.map(w => w.w).join(' ').toUpperCase(); const wd = ctx.measureText(line).width; const fit = Math.min(1, 960 / wd);
  ctx.translate(W / 2, 1560); ctx.scale(fit, fit);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(-wd / 2 - 30, -60, wd + 60, 120);
  let x = -wd / 2;
  chunk.forEach((w, i) => { const s = w.w.toUpperCase() + (i < chunk.length - 1 ? ' ' : ''); const sw = ctx.measureText(s).width;
    const on = t >= w.s; ctx.fillStyle = c0 + i === ci ? '#e8c46a' : (on ? '#f4efe4' : 'rgba(244,239,228,.25)'); ctx.textAlign = 'left'; ctx.fillText(s, x, 4); x += sw; });
  ctx.restore();
}
function title(t) {
  if (!TL.title) return; const k = seg(t, .2, .9) * (1 - seg(t, 2.6, 3.2)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.font = `700 92px 'DejaVu Serif', serif`; ctx.textAlign = 'center'; ctx.fillStyle = '#f4efe4';
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 20; ctx.fillText(TL.title.toUpperCase(), W / 2, 420); ctx.fillStyle = '#b3261e'; ctx.fillRect(W / 2 - 160, 470, 320, 8); ctx.restore();
}
window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let i = 0; for (let j = 0; j < TL.shots.length; j++) if (t >= TL.shots[j].start) i = j;
  const tr = TL.transitions.find(x => t >= x.t - x.dur / 2 && t < x.t + x.dur / 2);
  if (tr) { const b = TL.shots.findIndex(s => Math.abs(s.start - tr.t) < 1e-3); drawTransition(tr, b - 1, b, t); } else drawShot(i, t);
  grade(t); title(t); captions(t);
  const fi = seg(t, 0, .8), fo = 1 - seg(t, TL.duration - 1.2, TL.duration); if (fi < 1 || fo < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - Math.min(fi, fo)})`; ctx.fillRect(0, 0, W, H); }
};
</script></body></html>
