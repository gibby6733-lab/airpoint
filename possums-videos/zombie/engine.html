<script>
// MILE 41 — long-form episode renderer (1920x1080). Reads timeline.json beats (resolved shots) and draws each frame.

}

    txt('MI E 41', 0, -32, 44, '#b23a2e'); txt('G S', 0, 26, 40, '#333'); ctx.restore(); }

function station_int(b, t) {
  ctx.fillStyle = '#3d4a3f'; ctx.fillRect(0, 0, W, 860); ctx.fillStyle = '#34402f'; for (let x = 0; x < W; x += 160) ctx.fillRect(x, 0, 6, 860);

function road(b, t) {

function car(x, y, s, c, rot, tod) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.fillStyle = c; rr(-180, -90, 360, 80, 20); ctx.fill(); rr(-110, -150, 210, 70, 20); ctx.fill();
  ctx.fillStyle = '#2a3440'; rr(-95, -140, 85, 50, 8); ctx.fill(); rr(5, -140, 85, 50, 8); ctx.fill(); ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(-110, -10, 34, 0, 7); ctx.arc(110, -10, 34, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-200, -2, 0, 0); ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-60, -130); ctx.lineTo(-20, -100); ctx.stroke(); ctx.restore(); }

    ctx.fillStyle = '#e8dcc0'; rr(x + 60, 350, 320, 70, 8); ctx.fill(); txt(n, x + 220, 386, n.length > 7 ? 44 : 52, '#333');
    ctx.fillStyle = '#1a1e24'; ctx.fillRect(x + 40, 470, 160, 200); ctx.fillRect(x + 240, 470, 160, 200);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 60, 480); ctx.lineTo(x + 120, 560); ctx.lineTo(x + 90, 640); ctx.moveTo(x + 260, 500); ctx.lineTo(x + 330, 540); ctx.stroke();
    if (n === 'PHARMACY') { ctx.fillStyle = '#3c8a5a'; ctx.fillRect(x + 205, 250, 30, 80); ctx.fillRect(x + 180, 275, 80, 30); ctx.save(); ctx.translate(x + 300, 700); ctx.rotate(-.35); ctx.fillStyle = '#2a1e14'; ctx.fillRect(0, 0, 90, 150); ctx.restore(); } });
  ctx.fillStyle = '#56595e'; ctx.fillRect(0, 840, W, 240); ctx.fillStyle = '#9a9a9a'; ctx.fillRect(0, 840, W, 18);
  const r = rng(11); ctx.fillStyle = 'rgba(230,220,200,.6)'; for (let i = 0; i < 14; i++) { ctx.save(); ctx.translate(r() * W, 880 + r() * 180); ctx.rotate(r() * 3); ctx.fillRect(-14, -10, 28, 20); ctx.restore(); }

function pharmacy(b, t) {

  ctx.fillStyle = '#9da59a'; ctx.fillRect(0, 860, W, 220); ctx.strokeStyle = '#8a9288'; ctx.lineWidth = 3; for (let x = 0; x < W; x += 120) { ctx.beginPath(); ctx.moveTo(x, 860); ctx.lineTo(x - 80, H); ctx.stroke(); }

  ctx.fillStyle = '#3c8a5a'; rr(1150, 120, 420, 90, 10); ctx.fill(); txt('PHARMACY', 1360, 166, 54, '#fff');

// ======================================================= characters

  pip:    { coat: '#e1b12c', pants: '#34495e', skin: '#ffdbac', hair: '#7a4a1e', h: .7, glasses: true, dog: true },
  tank:   { coat: '#2e5c8a', pants: '#3b3b3b', skin: '#8d5524', h: 1.12, wide: 1.55, bald: true },

function person(name, x, y, s, pose, t, talking) {

    if (tool === 'wrench') { ctx.fillStyle = '#9aa0a6'; ctx.fillRect(-6, 150, 12, 90); ctx.beginPath(); ctx.arc(0, 245, 18, 0, 7); ctx.fill(); ctx.fillStyle = c.coat; ctx.fillRect(-6, 240, 12, 14); } ctx.restore(); };
  const sw = Math.sin(t * 2) * .05, gest = talking ? Math.sin(t * 5) * .35 : 0;
  const A = { idle: [.12 + sw, -.12 - sw], talk: [.15, -.9 + gest], scared: [2.6, -2.6], run: [.6 * Math.sin(run), -.6 * Math.sin(run)], cheer: [2.7, -2.7], sit: [.5, -.5], push: [1.45, -1.45], point: [.1, -1.5], cough: [.3, -2.3] }[pose] || [.1, -.1];
  arm(-1, A[0], c.tool && pose !== 'scared' && pose !== 'cheer' ? c.tool : null); arm(1, A[1]);

  const hy = by - 70; ctx.fillStyle = c.skin; ctx.beginPath(); ctx.arc(0, hy, 72, 0, 7); ctx.fill();
