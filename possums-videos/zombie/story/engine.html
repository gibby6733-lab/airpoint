let TL = null; window.setTimeline = tl => { TL = tl; };

// ================================================================ skies & places
function sky(tod, t, h = 1100) { const c = { day: ['#7f95a8', '#d8dee2'], dusk: ['#241a33', '#d06a3e'], night: ['#03050d', '#18233b'] }[tod];
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, c[0]); g.addColorStop(1, c[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, h);
  if (tod !== 'day') { const r = rng(3); ctx.fillStyle = '#fff'; for (let i = 0; i < 110; i++) { ctx.globalAlpha = (tod === 'night' ? .3 : .12) + .4 * Math.abs(Math.sin(t * .6 + i)); ctx.fillRect(r() * W, r() * h * .6, 2.4, 2.4); } ctx.globalAlpha = 1; }
  if (tod === 'night') { glow(830, 300, 260, 'rgba(220,230,255,.18)'); ctx.fillStyle = '#eceadc'; ctx.beginPath(); ctx.arc(830, 300, 62, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.08)'; [[812, 288, 12], [846, 318, 9], [838, 280, 6]].forEach(([a, b, r2]) => { ctx.beginPath(); ctx.arc(a, b, r2, 0, 7); ctx.fill(); }); }

}
function treeLine(y, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, y); for (let x = 0; x <= W; x += 30) ctx.lineTo(x, y - 40 - Math.abs(Math.sin(x * .05)) * 70 - Math.abs(Math.sin(x * .013)) * 50); ctx.lineTo(W, y + 10); ctx.lineTo(0, y + 10); ctx.fill(); }
function library_ext(b, t) {
  sky(b.tod, t); treeLine(1040, b.tod === 'day' ? '#56684a' : '#0d1410');

  ctx.fillStyle = b.tod === 'day' ? '#4f7a3a' : '#1c3320'; const r = rng(8); for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc(120 + r() * 120, 660 + r() * 480, 10 + r() * 14, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(860 + r() * 120, 660 + r() * 480, 10 + r() * 14, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(200,190,170,.5)'; for (let i = 0; i < 14; i++) { ctx.save(); ctx.translate(r() * W, 1270 + r() * 600); ctx.rotate(r() * 3); ctx.fillRect(-16, -11, 32, 22); ctx.restore(); }   // scattered pages
}

function river(b, t) { sky(b.tod, t, 900); treeLine(880, b.tod === 'day' ? '#4b5d3f' : '#0c120e');
  const g = ctx.createLinearGradient(0, 880, 0, 1500); g.addColorStop(0, '#5e6b4c'); g.addColorStop(1, '#3d4632'); ctx.fillStyle = g; ctx.fillRect(0, 880, W, 620);
  ctx.strokeStyle = 'rgba(220,230,200,.25)'; ctx.lineWidth = 3; for (let i = 0; i < 12; i++) { const y = 920 + i * 48; ctx.beginPath(); for (let x = -30; x <= W + 30; x += 30) ctx.lineTo(x, y + Math.sin(x * .03 + t * 2 + i) * 5); ctx.stroke(); }

function roof(b, t) { sky(b.tod, t, 1300); treeLine(1180, b.tod === 'day' ? '#4b5d3f' : '#0b100c');
  ctx.fillStyle = '#4a4440'; ctx.beginPath(); ctx.moveTo(0, 1320); ctx.lineTo(W, 1290); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill(); ctx.fillStyle = '#5e5650'; ctx.fillRect(0, 1300, W, 16);
  ctx.fillStyle = '#6a625b'; ctx.fillRect(820, 1150, 160, 160); ctx.fillStyle = '#3a3430'; ctx.fillRect(850, 1180, 100, 130); }

// ================================================================ characters

  ctx.fillStyle = '#7d5a3a'; rr(-60, by + 120, 44, 40, 8); ctx.fill(); rr(18, by + 120, 44, 40, 8); ctx.fill();      // pockets
  ctx.fillStyle = '#2e6a8a'; rr(-30, by + 10, 60, 40, 10); ctx.fill();                                               // scarf

function zombie(x, y, s, t, ph, o = {}) { ctx.save(); ctx.translate(x, y); if (o.turn) ctx.scale(-1, 1); ctx.scale(s, s);

function horde(z, k, t, ground) { if (!z) return; const S = { far: .3, mid: .5, near: .85 }[z.depth || 'mid'], gy = ground + ({ far: -40, mid: 0, near: 40 }[z.depth || 'mid']); const r = rng(z.n * 7 + 3), base = lerp(z.x0, z.x1, eInOut(k));
  const L = []; for (let i = 0; i < z.n; i++) L.push({ dx: (r() - .5) * .7, dy: r() * 50, ph: r() * 6 }); L.sort((a, b) => a.dy - b.dy).forEach(o => zombie((base + o.dx) * W, gy + o.dy, S * (1 + o.dy / 500), t, o.ph, { turn: z.turn })); }

// ================================================================ props / lesson visuals
function pot(x, y, s, t, boil) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (let i = 0; i < 5; i++) { const f = Math.sin(t * 14 + i * 2) * 8; ctx.fillStyle = i % 2 ? '#ffb347' : '#ff6a2a'; ctx.beginPath(); ctx.moveTo(-60 + i * 30, 80); ctx.quadraticCurveTo(-75 + i * 30 + f, 20, -45 + i * 30, -10 - (i % 2) * 20); ctx.quadraticCurveTo(-30 + i * 30, 30, -30 + i * 30, 80); ctx.fill(); }
  glow(0, 40, 200, 'rgba(255,140,60,.35)'); ctx.fillStyle = '#4a4a4a'; ctx.fillRect(-110, 80, 220, 20); ctx.fillRect(-100, 100, 14, 60); ctx.fillRect(86, 100, 14, 60);
  ctx.fillStyle = '#9aa2a8'; rr(-120, -150, 240, 160, 20); ctx.fill(); ctx.fillStyle = '#7d858b'; ctx.fillRect(-140, -150, 280, 22);
  if (boil) { ctx.fillStyle = 'rgba(200,225,240,.95)'; ctx.beginPath(); ctx.ellipse(0, -150, 112, 18, 0, 0, 7); ctx.fill(); for (let i = 0; i < 8; i++) { const bx = -90 + (i * 26 + t * 40) % 180, bb = Math.abs(Math.sin(t * 9 + i)) * 10; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(bx, -155 - bb, 5 + i % 3, 0, 7); ctx.fill(); }
    for (let i = 0; i < 4; i++) { const kk = (t * .5 + i / 4) % 1; ctx.fillStyle = `rgba(235,240,245,${.45 * (1 - kk)})`; ctx.beginPath(); ctx.arc(-40 + i * 26 + Math.sin(t + i) * 20, -190 - kk * 300, 30 + kk * 50, 0, 7); ctx.fill(); } }
  ctx.restore(); }
function smoke(x, y, t, amt) { for (let i = 0; i < 14; i++) { const kk = (t * .18 + i / 14) % 1; ctx.fillStyle = `rgba(150,150,160,${.4 * amt * (1 - kk)})`; ctx.beginPath(); ctx.arc(x + Math.sin(t * .6 + i) * 40 + kk * 160, y - kk * 1100, 40 + kk * 160, 0, 7); ctx.fill(); } }
function jar(x, y, s, fill, lid, cloth) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = 'rgba(200,225,240,.35)'; rr(-60, -170, 120, 170, 22); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = fill; rr(-54, -110, 108, 104, 16); ctx.fill(); if (lid) { ctx.fillStyle = '#b8862e'; rr(-66, -190, 132, 30, 8); ctx.fill(); }
  if (cloth) { ctx.fillStyle = '#e8e0cc'; ctx.beginPath(); ctx.moveTo(-90, -175); ctx.quadraticCurveTo(0, -60, 90, -175); ctx.lineTo(70, -190); ctx.quadraticCurveTo(0, -150, -70, -190); ctx.closePath(); ctx.fill(); } ctx.restore(); }
function bottle(x, y, s, fill) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = 'rgba(200,225,240,.45)'; rr(-50, -230, 100, 230, 26); ctx.fill(); rr(-22, -280, 44, 60, 10); ctx.fill(); ctx.fillStyle = fill; rr(-44, -150, 88, 144, 18); ctx.fill();
  const r = rng(5); ctx.fillStyle = 'rgba(80,60,30,.6)'; for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.arc(-34 + r() * 68, -140 + r() * 130, 3 + r() * 4, 0, 7); ctx.fill(); } ctx.restore(); }

// ================================================================ scenes (b = beat, k = 0..1 progress, t = time)
const SC = {
  hook(b, k, t) { library_int({ tod: 'night' }, t); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    const push = lerp(1.0, 1.12, k); withT(540, 1500, push, 0, () => { cole(0, 0, 1.15, t, { pose: 'think', talk: !!b.text, holdL: 'bottle' }); });
    const e = seg(k, 0, .12), e2 = seg(k, .45, .58); const flash = clamp(1 - k * 8); if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .6})`; ctx.fillRect(0, 0, W, H); }
    withT(540, 380, eBack(e), -.04, () => wrapTxt(b.h1, 0, 0, 92, 960, '#fff', 16));
    if (e2 > 0) withT(540, 640, eBack(e2), .03, () => { panel(-420, -90, 840, 180, '#c0392b', '#fff'); txt(b.h2, 0, 4, 96, '#fff', { stroke: 10, maxW: 780 }); }); },
  library_ext(b, k, t) { library_ext(b, t); horde(b.z, k, t, 1440); cole(lerp(540, 520, k), 1600, .95, t, { pose: b.pose || 'talk', talk: true }); },
  library_int(b, k, t) { library_int(b, t); cole(lerp(330, 360, k), 1620, 1.0, t, { pose: b.pose || 'talk', talk: true, holdL: b.hold }); },
  sink(b, k, t) { sink(b, t, k); },
  river(b, k, t) { river(b, t); horde(b.z, k, t, 900); cole(420, 1640, 1.0, t, { pose: b.pose || 'crouch', holdR: 'bottle', talk: true }); if (b.showBottle) withT(820, 1300, eBack(seg(k, .1, .3)), 0, () => bottle(0, 0, 1.4, 'rgba(120,110,70,.85)')); },
  step(b, k, t) { library_int({ tod: b.tod || 'night' }, t); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    if (b.n === 2) { roof({ tod: 'dusk' }, t); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H); pot(540, 1180, 1.4, t, k > .15); }
    if (b.n === 1) { jar(540, 1250, 1.8, 'rgba(170,200,220,.8)', false, true); for (let i = 0; i < 6; i++) { const kk = (t * 1.5 + i / 6) % 1; ctx.fillStyle = 'rgba(120,110,70,.9)'; ctx.beginPath(); ctx.arc(520 + (i % 3) * 20, 860 + kk * 160, 7, 0, 7); ctx.fill(); } }
    if (b.n === 3) { [380, 540, 700].forEach((x, i) => jar(x, 1260, 1.2, 'rgba(180,215,235,.85)', seg(k, .3 + i * .1, .4 + i * .1) > .5)); }
    withT(540, 330, eBack(seg(k, 0, .15)), 0, () => { panel(-430, -110, 860, 220, '#1f9d55', '#fff'); txt('STEP ' + b.n, 0, -40, 54, '#d8ffd8'); txt(b.title, 0, 34, 70, '#fff', { stroke: 8, maxW: 780 }); });
    if (b.sub) withT(540, 600, 1, 0, () => { ctx.globalAlpha = seg(k, .25, .4); wrapTxt(b.sub, 0, 0, 52, 900, '#ffe14a', 10); ctx.globalAlpha = 1; }); },
  warn(b, k, t) { river(b, t); withT(540, 1150, eBack(seg(k, 0, .2)), 0, () => bottle(0, 0, 1.8, 'rgba(120,110,70,.9)'));
    withT(540, 560, eBack(seg(k, .15, .3)), -.04, () => { panel(-430, -100, 860, 200, '#c0392b', '#fff'); txt('NEVER DRINK IT RAW', 0, 4, 66, '#fff', { stroke: 8, maxW: 800 }); }); },
  roof(b, k, t) { roof(b, t); horde(b.z, k, t, 1220); pot(700, 1500, .9, t, true); smoke(700, 1400, t, b.smoke || 1); cole(330, 1700, .95, t, { pose: b.pose || 'idle', talk: true, look: 1 }); },
  question(b, k, t) { library_int({ tod: 'night' }, t); ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); cole(540, 1990, .8, t, { pose: 'think', talk: !!b.text });
    txt('WOULD YOU RATHER...', 540, 300, 76, '#ffe14a', { stroke: 12 });
    const e1 = eBack(clamp(seg(k, .02, .2))), e2 = eBack(clamp(seg(k, .2, .38)));
    withT(540, 560, e1, -.01, () => { panel(-450, -150, 900, 300, '#c0392b', '#fff'); wrapTxt(b.opt1, 0, 0, 60, 800); });
    withT(540, 1000, e2, .01, () => { panel(-450, -150, 900, 300, '#1f6f8b', '#fff'); wrapTxt(b.opt2, 0, 0, 60, 800); });
    if (e2 > .5) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(540, 780, 66, 0, 7); ctx.fill(); ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 6; ctx.stroke(); txt('OR', 540, 782, 52, '#ffe14a'); }
    if (b.countdown) { const left = 3 - Math.floor(k * 3); ctx.save(); ctx.translate(540, 1300); ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(0, 0, 90, 0, 7); ctx.stroke(); ctx.strokeStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(0, 0, 90, -Math.PI / 2, -Math.PI / 2 + (1 - k) * 6.283); ctx.stroke(); txt(String(Math.max(1, left)), 0, 0, 110, '#fff'); ctx.restore(); }
    if (b.vote) { txt('VOTE IN THE POLL ▼', 540, 1290, 70, '#7cd67c', { stroke: 12 }); if (b.recap) withT(540, 1420, 1, 0, () => { panel(-430, -55, 860, 110, 'rgba(31,157,85,.9)', null); txt(b.recap, 0, 2, 44, '#fff', { maxW: 800 }); }); } },
};
// ================================================================ frame
function captions(t) { const B = TL.beats.find(b => b.text && t >= b.start - .05 && t <= b.end + .2); if (!B || B.scene === 'hook' || B.scene === 'question') return;
  const ws = B.words; let ci = ws.findIndex((w, i) => t >= w.s && (i === ws.length - 1 || t < ws[i + 1].s)); if (ci < 0) ci = 0; const c0 = Math.floor(ci / 3) * 3, chunk = ws.slice(c0, c0 + 3);
  ctx.save(); ctx.font = '900 84px Inter'; const parts = chunk.map(w => w.w.toUpperCase()), sp = 22, ws2 = parts.map(p => ctx.measureText(p).width), tot = ws2.reduce((a, c) => a + c, 0) + sp * (parts.length - 1), fit = Math.min(1, 980 / tot);
  let x = 540 - tot * fit / 2; parts.forEach((p, q) => { withT(x + ws2[q] * fit / 2, 1780, fit, 0, () => txt(p, 0, 0, 84, c0 + q === ci ? '#ffe14a' : '#fff', { stroke: 16 })); x += (ws2[q] + sp) * fit; }); ctx.restore(); }
window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let i = 0; for (let j = 0; j < TL.beats.length; j++) if (t >= TL.beats[j].start - .2) i = j; const b = TL.beats[i], k = clamp((t - b.start) / Math.max(.3, b.end - b.start));
  const sh = (b.fx || []).includes('shake') ? Math.sin(t * 50) * 9 : 0; ctx.save(); ctx.translate(sh, 0);
  // slow camera push for life
  const z = 1 + .04 * k; ctx.translate(540, 1100); ctx.scale(z, z); ctx.translate(-540, -1100);
  (SC[b.scene] || SC.library_int)(b, k, t); ctx.restore();
  if (b.tod === 'night' || b.scene === 'hook') { ctx.fillStyle = 'rgba(5,10,30,.12)'; ctx.fillRect(0, 0, W, H); }
  const v = ctx.createRadialGradient(540, 960, 500, 540, 960, 1200); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const r = rng(Math.floor(t * 24)); ctx.fillStyle = 'rgba(255,255,255,.03)'; for (let q = 0; q < 200; q++) ctx.fillRect(r() * W, r() * H, 2, 2);
  // lesson tag + day badge (after the hook)
  if (b.scene !== 'hook') { panel(36, 60, 230, 90, '#c0392b', '#000', 24); txt('DAY ' + (TL.day || 1), 151, 106, 52, '#fff', { stroke: 8 });
    panel(300, 60, 744, 90, 'rgba(10,12,18,.85)', '#1f9d55', 24); txt('LESSON: ' + (TL.lesson || ''), 672, 106, 40, '#7cd67c', { maxW: 700 }); }
  if (b.tag) withT(540, 1560, eBack(seg(k, .2, .35)), -.03, () => { panel(-440, -60, 880, 120, 'rgba(31,157,85,.92)', '#fff'); txt(b.tag, 0, 3, 50, '#fff', { maxW: 820 }); });
  captions(t);
  const cut = i > 0 && TL.beats[i - 1].scene !== b.scene ? clamp(1 - (t - (b.start - .2)) / .22) : 0; if (cut > 0) { ctx.fillStyle = `rgba(0,0,0,${cut})`; ctx.fillRect(0, 0, W, H); }
  const fo = 1 - clamp((t - (TL.duration - 1.0)) / 1.0); if (fo < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fo})`; ctx.fillRect(0, 0, W, H); }
};
