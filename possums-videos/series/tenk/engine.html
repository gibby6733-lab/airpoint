<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// "30 Days: $1 to $10,000" — flat 2D cartoon, 9:16. Benny turns $1 into $10K; viewers vote each day.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
let TL = null; window.setTimeline = tl => { TL = tl; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k, seg = (u, a, b) => clamp((u - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3), eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, eBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, color = '#fff', o = {}) { ctx.save(); ctx.font = `${o.weight || 900} ${size}px Inter`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.maxW) { const w = ctx.measureText(s).width; if (w > o.maxW) { ctx.translate(x, y); ctx.scale(o.maxW / w, o.maxW / w); x = 0; y = 0; } }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.stroke; ctx.strokeStyle = o.sc || '#1b1b2f'; ctx.strokeText(s, x, y); } ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore(); }
function withT(x, y, s, r, fn) { ctx.save(); ctx.translate(x, y); ctx.rotate(r || 0); ctx.scale(s, s); fn(); ctx.restore(); }
function box(x, y, w, h, fill, line = '#1b1b2f', r = 22, lw = 7) { ctx.fillStyle = fill; rr(x, y, w, h, r); ctx.fill(); if (line) { ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke(); } }
function circ(x, y, r, fill, line = '#1b1b2f', lw = 6) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = fill; ctx.fill(); if (line) { ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke(); } }
const K = '#1b1b2f';

// ================================================================ characters (flat cartoon, thick outlines)
// p: {x,y,s, pose, flip, look, mouth, hair, hoodie, skin, pants, kind}
function person(p, t) { ctx.save(); ctx.translate(p.x, p.y); ctx.scale((p.s || 1) * (p.flip ? -1 : 1), p.s || 1);
  const pose = p.pose || 'idle', walk = pose === 'walk' || pose === 'run' ? Math.sin(t * (pose === 'run' ? 16 : 9)) : 0, bob = pose === 'idle' || pose === 'talk' ? Math.sin(t * 2.4) * 4 : -Math.abs(walk) * 10;
  const skin = p.skin || '#f2c49b', hood = p.hoodie || '#f28c28', pants = p.pants || '#3a5a8c';
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 6, 120, 20, 0, 0, 7); ctx.fill();
  ctx.translate(0, bob);
  // legs
  for (const sd of [-1, 1]) { ctx.save(); ctx.translate(sd * 34, -210); ctx.rotate(sd * walk * .35); box(-28, 0, 56, 190, pants, K, 20, 6); box(-38, 175, 80, 40, '#f4f4f4', K, 18, 6); ctx.fillStyle = '#e04a3a'; ctx.fillRect(-30, 200, 64, 8); ctx.restore(); }
  // body
  box(-95, -470, 190, 280, hood, K, 60, 7); ctx.fillStyle = 'rgba(0,0,0,.12)'; rr(-60, -330, 120, 70, 24); ctx.fill();
  if (p.kind === 'mom') { box(-95, -470, 190, 280, '#9b6ad1', K, 60, 7); ctx.fillStyle = '#c9a6ee'; ctx.fillRect(-12, -460, 24, 270); }
  // arms
  const arms = { idle: [.15, -.15], talk: [.2, -1.1 + Math.sin(t * 5) * .25], point: [.15, -1.6], proud: [2.5, -2.5], shock: [2.7, -2.7], walk: [walk * .6, -walk * .6], run: [walk * 1.1, -walk * 1.1], hold: [.4, -1.2], sell: [.3, -1.45], cheer: [2.9, -2.9], sad: [.05, -.05] }[pose] || [.15, -.15];
  for (const [sd, a] of [[-1, arms[0]], [1, arms[1]]]) { ctx.save(); ctx.translate(sd * 92, -440); ctx.rotate(a); box(-24, 0, 48, 175, p.kind === 'mom' ? '#9b6ad1' : hood, K, 22, 6); circ(0, 185, 28, skin); ctx.restore(); }
  // head
  const hy = -590; circ(0, hy, 125, skin, K, 7);
  circ(-118, hy + 10, 26, skin, K, 6); circ(118, hy + 10, 26, skin, K, 6);
  if (p.kind === 'mom') { ctx.fillStyle = '#8a4a2a'; ctx.beginPath(); ctx.arc(0, hy - 30, 130, Math.PI, 0); ctx.fill(); for (let i = -2; i <= 2; i++) circ(i * 45, hy - 135, 24, '#ff8ab8', K, 5); }
  else if (p.kind === 'kid') { ctx.fillStyle = p.hair || '#5a3a22'; ctx.beginPath(); ctx.arc(0, hy - 25, 128, Math.PI, 0); ctx.fill(); circ(-140, hy - 10, 38, p.hair || '#5a3a22', K, 5); circ(140, hy - 10, 38, p.hair || '#5a3a22', K, 5); }
  else if (p.kind === 'baby') { ctx.fillStyle = '#e8c39b'; ctx.fillRect(-4, hy - 150, 8, 40); }
  else { ctx.fillStyle = p.hair || '#3b2414'; ctx.beginPath(); ctx.moveTo(-130, hy - 10); for (let i = 0; i <= 8; i++) { const a = Math.PI + i / 8 * Math.PI; ctx.lineTo(Math.cos(a) * (135 + (i % 2) * 30), hy - 20 + Math.sin(a) * (125 + (i % 2) * 30)); } ctx.closePath(); ctx.fill(); }
  if (p.visor) { ctx.fillStyle = '#2e86c1'; ctx.fillRect(-120, hy - 70, 240, 26); ctx.fillRect(0, hy - 60, 150, 18); }
  // face
  const blink = (t % 3.3) < .1, look = p.look || 0;
  for (const sd of [-1, 1]) { circ(sd * 45 + look * 6, hy - 10, 30, '#fff', K, 5); if (!blink) circ(sd * 45 + look * 14, hy - 6, 13, K, null); else { ctx.fillStyle = K; ctx.fillRect(sd * 45 - 26, hy - 10, 52, 7); } }
  const m = p.mouth || (pose === 'shock' ? 'o' : pose === 'sad' ? 'sad' : 'smile');
  ctx.strokeStyle = K; ctx.lineWidth = 7; ctx.lineCap = 'round';
  if (m === 'o') { circ(0, hy + 60, 24, '#7a2a2a', K, 5); }
  else if (m === 'sad') { ctx.beginPath(); ctx.arc(0, hy + 85, 34, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
  else if (m === 'talk' || pose === 'talk') { const o = 8 + Math.abs(Math.sin(t * 15)) * 22; ctx.fillStyle = '#7a2a2a'; ctx.beginPath(); ctx.ellipse(0, hy + 60, 32, o, 0, 0, 7); ctx.fill(); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(0, hy + 35, 44, .2, Math.PI - .2); ctx.stroke(); }
  if (pose === 'shock' || p.sweat) { ctx.fillStyle = '#7fd0ff'; ctx.beginPath(); ctx.ellipse(110, hy - 70, 14, 22, 0, 0, 7); ctx.fill(); }
  ctx.restore(); }

// ================================================================ props / backgrounds
function sky(c0, c1, h = 1300) { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, h); }
function cloud(x, y, s) { ctx.fillStyle = '#fff'; for (const [dx, dy, r] of [[0, 0, 60], [60, -20, 70], [120, 0, 55]]) { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); } }
function dollar(x, y, s, r = 0) { withT(x, y, s, r, () => { box(-110, -55, 220, 110, '#8fd18a', K, 10, 6); circ(0, 0, 36, '#5fae5a', K, 5); txt('$1', 0, 2, 40, '#fff', { stroke: 6 }); txt('1', -80, -30, 26, '#2e6a2e', { weight: 800 }); txt('1', 80, 30, 26, '#2e6a2e', { weight: 800 }); }); }
function lolly(x, y, s, col = '#ff5a8a', r = 0) { withT(x, y, s, r, () => { ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 120); ctx.stroke(); circ(0, 0, 40, col, K, 5); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 4.5); ctx.stroke(); }); }
function floorRoom(wall, floor, y = 1250) { ctx.fillStyle = wall; ctx.fillRect(0, 0, W, y); ctx.fillStyle = floor; ctx.fillRect(0, y, W, H - y); ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, y, W, 16); }
function street(t, k, scroll = 0) { sky('#7cc8f8', '#cfeeff'); for (let i = 0; i < 4; i++) cloud(((i * 330 - scroll * .2 + t * 15) % 1400) - 200, 180 + (i % 2) * 120, 1);
  const r = rng(4); let x = -((scroll * .5) % 300) - 300; while (x < W + 300) { const w = 220 + r() * 120, h = 300 + r() * 380; box(x, 1150 - h, w, h + 50, ['#f6b26b', '#9fc5e8', '#b6d7a8', '#d5a6bd', '#ffe599'][Math.floor(r() * 5)], K, 8, 6);
    for (let yy = 1150 - h + 40; yy < 1080; yy += 110) for (let xx = x + 30; xx < x + w - 50; xx += 90) box(xx, yy, 50, 66, '#fff8dc', K, 4, 4); x += w + 20; }
  ctx.fillStyle = '#c9c9c9'; ctx.fillRect(0, 1150, W, 120); ctx.fillStyle = '#5a5a66'; ctx.fillRect(0, 1270, W, H - 1270); ctx.fillStyle = '#ffe14a'; for (let xx = -((scroll) % 160); xx < W; xx += 160) ctx.fillRect(xx, 1560, 90, 18); }
function park(t, k) { sky('#8fd3ff', '#d8f3ff', 1100); cloud(120, 220, 1.1); cloud(700, 160, .9);
  ctx.fillStyle = '#7fd06a'; ctx.fillRect(0, 1000, W, H - 1000); ctx.fillStyle = '#6bbf57'; for (let i = 0; i < 40; i++) { const r = rng(i); ctx.fillRect(r() * W, 1000 + r() * 900, 6, 16); }
  for (const x of [120, 960]) { box(x - 26, 700, 52, 320, '#8a5a2a', K, 8, 6); circ(x, 640, 140, '#4caf50', K, 7); circ(x - 80, 700, 90, '#4caf50', K, 7); circ(x + 80, 700, 90, '#4caf50', K, 7); }
  ctx.fillStyle = '#e8d29a'; ctx.beginPath(); ctx.moveTo(0, 1250); ctx.quadraticCurveTo(540, 1150, W, 1300); ctx.lineTo(W, 1420); ctx.quadraticCurveTo(540, 1270, 0, 1380); ctx.fill(); }
function card(x, y, w, h, title, lines, fill = '#fff') { box(x, y, w, h, fill, K, 30, 8); txt(title, x + w / 2, y + 70, 56, '#e04a3a'); lines.forEach((l, i) => txt(l[0], x + w / 2, y + 170 + i * 100, l[2] || 60, l[1] || K, { maxW: w - 60 })); }

// ================================================================ scenes  (L = line, k = 0..1 progress in line, t = time)
const SC = {
  hook(L, k, t) { street(t, k, t * 40); ctx.fillStyle = 'rgba(20,20,40,.35)'; ctx.fillRect(0, 0, W, H);
    person({ x: 540, y: 1830, s: .95, pose: 'shock' }, t); withT(540, 1080, 1 + Math.sin(t * 6) * .05, Math.sin(t * 3) * .1, () => dollar(0, 230, 1.4));
    withT(540, 420, eBack(seg(k, 0, .2)), -.04, () => { txt('$1', -230, 0, 190, '#8fd18a', { stroke: 20 }); txt('→', 0, 0, 130, '#fff', { stroke: 16 }); txt('$10K', 260, 0, 190, '#ffe14a', { stroke: 20 }); });
    withT(540, 620, eBack(seg(k, .2, .4)), .03, () => { box(-330, -70, 660, 140, '#e04a3a', K, 30, 8); txt('30 DAYS', 0, 4, 96, '#fff', { stroke: 10 }); }); },
  kitchen(L, k, t) { floorRoom('#ffe7b3', '#c98b5a'); box(60, 300, 340, 700, '#e8f4f8', K, 20, 8); ctx.fillStyle = '#c8dde6'; ctx.fillRect(68, 620, 324, 8); box(330, 420, 24, 120, '#999', K, 8, 4);
    if (seg(k, .55, .7) > 0) withT(230, 450, eBack(seg(k, .55, .7)), -.08, () => { box(-80, -70, 160, 140, '#fff27a', K, 8, 5); txt('NOTE', 0, 0, 34, K); });
    box(560, 1050, 460, 40, '#b0703a', K, 10, 6); box(600, 1090, 30, 160, '#8a5a2a', K, 6, 5); box(950, 1090, 30, 160, '#8a5a2a', K, 6, 5);
    const slap = seg(k, .2, .3); dollar(790, lerp(800, 1015, eOut(slap)), .7, .1); if (slap > .9 && slap < 1) { ctx.strokeStyle = K; ctx.lineWidth = 6; for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28; ctx.beginPath(); ctx.moveTo(790 + Math.cos(a) * 120, 1030 + Math.sin(a) * 40); ctx.lineTo(790 + Math.cos(a) * 170, 1030 + Math.sin(a) * 60); ctx.stroke(); } }
    person({ x: 760, y: 1700, s: 1.0, pose: k < .4 ? 'point' : 'talk', kind: 'mom', flip: true, mouth: 'talk' }, t); person({ x: 300, y: 1760, s: .95, pose: 'shock', look: 1 }, t); },
  note(L, k, t) { ctx.fillStyle = '#c8dde6'; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 6; i++) { ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(0, i * 340, W, 6); }
    withT(540, 950, eBack(seg(k, 0, .15)), -.03, () => { box(-420, -520, 840, 1040, '#fff27a', K, 14, 9); circ(0, -500, 34, '#e04a3a', K, 6);
      const ws = ['$10,000', 'IN 30 DAYS', 'OR YOU\'RE', 'MOVING OUT.']; ws.forEach((w, i) => { const e = seg(k, .1 + i * .13, .2 + i * .13); if (e > 0) { ctx.globalAlpha = e; txt(w, 0, -300 + i * 150, 104, i === 0 ? '#e04a3a' : K, { weight: 800, maxW: 740 }); ctx.globalAlpha = 1; } });
      if (k > .78) { txt('Love, Mom', 120, 330, 72, K, { weight: 700 }); ctx.strokeStyle = '#e04a3a'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-60, 380); ctx.bezierCurveTo(-30, 340, 10, 360, 0, 400); ctx.bezierCurveTo(-10, 360, 30, 340, 60, 380); ctx.stroke(); } }); },
  room(L, k, t) { floorRoom('#7e8ab0', '#6a5a4a'); box(80, 250, 360, 280, '#2a2f45', K, 14, 8); txt('GAME OVER', 260, 390, 46, '#e04a3a');
    box(620, 900, 400, 160, '#5a7ad1', K, 20, 8); box(600, 1040, 440, 210, '#4a64b0', K, 20, 8); ctx.fillStyle = '#ddd'; for (let i = 0; i < 6; i++) { const r = rng(i); ctx.fillRect(r() * 900 + 60, 1300 + r() * 400, 70, 22); }
    if (L.pose === 'proud') { person({ x: 540, y: 1780, s: 1.05, pose: 'proud' }, t); withT(820, 600, eBack(seg(k, .55, .75)), .1, () => { box(-150, -110, 300, 220, '#fff', K, 24, 7); circ(-40, 0, 55, '#ff9f43', K, 5); ctx.fillStyle = '#e04a3a'; ctx.beginPath(); ctx.moveTo(30, -60); ctx.lineTo(120, 60); ctx.lineTo(-10, 60); ctx.fill(); }); return; }
    person({ x: 540, y: 1780, s: 1.05, pose: 'hold' }, t);
    const items = [['$1', '#8fd18a'], ['3%', '#e04a3a'], ['NO SEAT', '#ffe14a']]; items.forEach(([s, c], i) => { const e = seg(k, .15 + i * .25, .28 + i * .25); if (e <= 0) return; withT(200 + i * 300, 700, eBack(e), (i - 1) * .06, () => { box(-140, -110, 280, 220, '#fff', K, 26, 8); txt(s, 0, 0, 74, c, { stroke: 8 }); }); });
    txt('ASSETS', 540, 470, 80, '#fff', { stroke: 12 }); },
  ride(L, k, t) { street(t, k, t * 600); const x = 540 + Math.sin(t * 2) * 20; ctx.save(); ctx.translate(x, 1560);
    ctx.strokeStyle = K; ctx.lineWidth = 12; for (const wx of [-170, 170]) { circ(wx, 0, 90, 'rgba(0,0,0,0)', K, 12); ctx.save(); ctx.translate(wx, 0); ctx.rotate(t * 14); ctx.lineWidth = 4; for (let i = 0; i < 4; i++) { ctx.rotate(.78); ctx.beginPath(); ctx.moveTo(-88, 0); ctx.lineTo(88, 0); ctx.stroke(); } ctx.restore(); }
    ctx.strokeStyle = '#e04a3a'; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(-170, 0); ctx.lineTo(-40, -150); ctx.lineTo(120, -150); ctx.lineTo(170, 0); ctx.moveTo(-40, -150); ctx.lineTo(0, 0); ctx.lineTo(-170, 0); ctx.moveTo(120, -150); ctx.lineTo(140, -230); ctx.stroke(); ctx.strokeStyle = '#999'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-40, -150); ctx.lineTo(-50, -200); ctx.stroke(); ctx.restore();
    person({ x: x - 20, y: 1420, s: .8, pose: 'run', sweat: true }, t); withT(380, 1180, eBack(seg(k, .4, .55)), -.08, () => { box(-150, -50, 300, 100, '#fff', K, 20, 6); txt('NO SEAT', 0, 3, 46, '#e04a3a'); }); },
  store(L, k, t) { floorRoom('#fff5d6', '#e3e0d8', 1300); box(0, 120, W, 150, '#2e9d5a', K, 0, 8); txt('DOLLAR STORE', 540, 195, 92, '#fff', { stroke: 12 });
    for (let s = 0; s < 3; s++) { box(40, 400 + s * 250, 1000, 26, '#b0703a', K, 6, 5); const r = rng(s + 3); for (let x = 70; x < 1010; x += 90) box(x, 400 + s * 250 - 120, 70, 120, ['#ff6b6b', '#4dabf7', '#ffd43b', '#69db7c', '#da77f2'][Math.floor(r() * 5)], K, 10, 4); }
    const bagX = L.spend ? lerp(760, 560, seg(k, .1, .5)) : 760; withT(bagX, 1180, 1 + .04 * Math.sin(t * 5), .05, () => { box(-120, -150, 240, 300, 'rgba(220,240,255,.85)', K, 30, 7); for (let i = 0; i < 9; i++) lolly(-70 + (i % 3) * 70, -90 + Math.floor(i / 3) * 70, .45, ['#ff5a8a', '#ffb02e', '#4dabf7'][i % 3]); txt('20', 0, 110, 60, '#e04a3a', { stroke: 8 }); });
    person({ x: 320, y: 1800, s: 1.0, pose: L.spend ? 'sell' : 'point', look: 1 }, t);
    if (L.spend) { dollar(lerp(420, 760, seg(k, .1, .6)), lerp(1250, 1000, seg(k, .1, .6)), .6, t * 3); withT(540, 520, eBack(seg(k, .4, .6)), -.05, () => { box(-330, -80, 660, 160, '#e04a3a', K, 26, 8); txt('$1 → $0', 0, 4, 100, '#fff', { stroke: 10 }); }); }
    else withT(760, 820, eBack(seg(k, .6, .8)), .05, () => { box(-170, -70, 340, 140, '#ffe14a', K, 24, 7); txt('ONLY $1', 0, 4, 64, K); }); },
  math(L, k, t) { ctx.fillStyle = '#244d3a'; ctx.fillRect(0, 0, W, H); box(40, 220, 1000, 1350, '#2e5e45', '#8a5a2a', 20, 30); txt('THE PLAN', 540, 360, 96, '#fff', { weight: 800 });
    const rows = [['20 LOLLIPOPS', '#fff'], ['× $0.25 EACH', '#fff'], ['= $5.00', '#8fd18a'], ['PROFIT: 400%', '#ffe14a']]; rows.forEach(([s, c], i) => { const e = seg(k, .05 + i * .2, .15 + i * .2); if (e > 0) withT(540, 600 + i * 220, eBack(e), (i % 2 ? .02 : -.02), () => txt(s, 0, 0, 110, c, { weight: 800, maxW: 900 })); });
    for (let i = 0; i < 20; i++) { const e = seg(k, i * .02, .2 + i * .02); if (e > 0) lolly(110 + (i % 10) * 95, 1640 + Math.floor(i / 10) * 120, .5 * e, ['#ff5a8a', '#ffb02e', '#4dabf7'][i % 3]); } },
  park(L, k, t) { park(t, k); box(380, 1200, 320, 60, '#b0703a', K, 10, 6); box(400, 1260, 20, 140, '#8a5a2a', K, 6, 5); box(660, 1260, 20, 140, '#8a5a2a', K, 6, 5); box(400, 1050, 280, 140, '#fff', K, 14, 6); txt('25¢', 540, 1120, 72, '#e04a3a');
    for (let i = 0; i < 6; i++) lolly(420 + i * 45, 1170, .35, ['#ff5a8a', '#ffb02e', '#4dabf7'][i % 3]); person({ x: 300, y: 1760, s: .95, pose: 'sell' }, t);
    if (seg(k, .5, .6) > 0) person({ x: lerp(1200, 820, eOut(seg(k, .5, .8))), y: 1700, s: .5, pose: 'walk', kind: 'baby', hoodie: '#7fd0ff', pants: '#7fd0ff', flip: true }, t); },
  toddler(L, k, t) { park(t, k); const chase = seg(k, .65, 1);
    const bx = lerp(820, 1300, eInOut(chase)), tx = lerp(480, 1500, eInOut(chase));
    person({ x: chase > 0 ? tx : 320, y: 1760, s: .95, pose: chase > 0 ? 'run' : 'talk' }, t); person({ x: chase > 0 ? bx : 760, y: 1700, s: .5, pose: chase > 0 ? 'run' : 'idle', kind: 'baby', hoodie: '#7fd0ff', pants: '#7fd0ff', flip: chase <= 0 }, t);
    const offers = [['10¢', .05, 760], ['25¢', .3, 320]]; offers.forEach(([s, a, x]) => { const e = seg(k, a, a + .1); if (e > 0 && k < .65) withT(x, 1050, eBack(e), 0, () => { box(-120, -80, 240, 160, '#fff', K, 40, 7); txt(s, 0, 4, 80, '#e04a3a'); }); }); },
  rival(L, k, t) { park(t, k); box(560, 1130, 440, 70, '#ffe14a', K, 10, 7); box(580, 980, 400, 150, '#fff', K, 14, 7); txt('LEMONADE $2', 780, 1055, 54, '#e0a020', { maxW: 360 });
    box(600, 1200, 30, 200, '#8a5a2a', K, 6, 5); box(930, 1200, 30, 200, '#8a5a2a', K, 6, 5); box(880, 1080, 70, 46, '#333', K, 8, 4);
    person({ x: 780, y: 1720, s: .75, pose: 'talk', kind: 'kid', hoodie: '#ff8ab8', hair: '#e0a020', visor: true }, t); person({ x: 230, y: 1780, s: .9, pose: 'shock', look: 1 }, t);
    if (L.line) { for (let i = 0; i < 5; i++) person({ x: 1150 - i * 0 + i * 90 - 100, y: 1800 + i * 10, s: .55, pose: 'idle', kind: 'kid', hoodie: ['#4dabf7', '#69db7c', '#ffd43b', '#da77f2', '#ff6b6b'][i], flip: true }, t + i); withT(700, 820, eBack(seg(k, .3, .5)), .04, () => { box(-200, -70, 400, 140, '#69db7c', K, 24, 7); txt('HAS A LINE', 0, 4, 58, K); }); }

// ================================================================ HUD, captions, frame
function moneyAt(t) { let prev = 1, cur = 1, st = 0; for (const l of TL.lines) { if (t >= l.start) { prev = cur; cur = l.money ?? cur; st = l.start; } } const tw = (l => l)(TL.lines.find(l => l.start === st));
  let at = st; if (tw && tw.sfx_times) { const c = tw.sfx_times.find(s => s[0] === 'cash' || s[0] === 'spend'); if (c) at = c[1]; } return t < at ? prev : lerp(prev, cur, eOut(clamp((t - at) / .7))); }
function hud(t, L) { if (L.scene === 'vote' || L.scene === 'counter') return; const m = moneyAt(t);
  box(30, 40, 250, 110, '#e04a3a', K, 26, 7); txt('DAY 1/30', 155, 96, 50, '#fff', { stroke: 6, maxW: 220 });
  box(300, 40, 440, 110, '#1e2140', K, 26, 7); txt('$' + m.toFixed(2), 520, 96, 72, '#8fd18a', { stroke: 6 });
  box(760, 40, 290, 110, '#fff', K, 26, 7); txt('GOAL', 905, 76, 30, K, { weight: 800 }); txt('$10,000', 905, 118, 44, '#e04a3a', { weight: 900 }); }
function captions(t) { const L = TL.lines.find(l => t >= l.start - .05 && t <= l.end + .2); if (!L || ['note', 'math', 'vote', 'counter'].includes(L.scene)) return;
  const ws = L.words; let ci = ws.findIndex((w, i) => t >= w.s && (i === ws.length - 1 || t < ws[i + 1].s)); if (ci < 0) ci = 0; const c0 = Math.floor(ci / 3) * 3, ch = ws.slice(c0, c0 + 3);
  ctx.save(); ctx.font = '900 82px Inter'; const ps = ch.map(w => w.w.toUpperCase()), sp = 22, wd = ps.map(p => ctx.measureText(p).width), tot = wd.reduce((a, c) => a + c, 0) + sp * (ps.length - 1), f = Math.min(1, 980 / tot);
  let x = 540 - tot * f / 2; ps.forEach((p, q) => { withT(x + wd[q] * f / 2, 960, f, 0, () => txt(p, 0, 0, 82, c0 + q === ci ? '#ffe14a' : '#fff', { stroke: 16 })); x += (wd[q] + sp) * f; }); ctx.restore(); }
window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let i = 0; for (let j = 0; j < TL.lines.length; j++) if (t >= TL.lines[j].start - .15) i = j; const L = TL.lines[i], k = clamp((t - L.start) / Math.max(.3, L.end - L.start));
  ctx.save(); const z = 1 + .03 * k; ctx.translate(540, 1100); ctx.scale(z, z); ctx.translate(-540, -1100); (SC[L.scene] || SC.room)(L, k, t); ctx.restore();
  hud(t, L); captions(t);
  const prev = TL.lines[i - 1]; if (prev && prev.scene !== L.scene) { const c = clamp(1 - (t - (L.start - .15)) / .18); if (c > 0) { ctx.fillStyle = `rgba(255,255,255,${c * .8})`; ctx.fillRect(0, 0, W, H); } }
  const fo = 1 - clamp((t - (TL.duration - .8)) / .8); if (fo < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fo})`; ctx.fillRect(0, 0, W, H); }
};
