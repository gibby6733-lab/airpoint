<script>
// "13 Days to Thanksgiving" — flat 2D cartoon, 9:16. Marcus faked being a chef online; viewers pick what he learns each day.

// ================================================================ characters (flat cartoon, thick outlines)

// ================================================================ props / backgrounds

  ctx.fillStyle = floor; ctx.fillRect(0, y, W, H - y); if (planks) { ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 4; for (let yy = y + 70, j = 0; yy < H; yy += 90 + j * 12, j++) { ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); for (let x = (j % 2) * 180 + 60; x < W; x += 360) { ctx.beginPath(); ctx.moveTo(x, yy - 90 - (j - 1) * 12); ctx.lineTo(x, yy); ctx.stroke(); } } }
  else { ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 4; for (let x = -400; x < W + 400; x += 160) { ctx.beginPath(); ctx.moveTo(540 + (x - 540) * .5, y); ctx.lineTo(x, H); ctx.stroke(); } for (let yy = y + 80, j = 1; yy < H; yy += 60 + j * 25, j++) { ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); } }
