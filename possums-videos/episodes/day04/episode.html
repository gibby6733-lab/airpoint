<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d'); let PXo = 0, PYo = 0;
let TL = null;            // timeline injected by renderer
const FONT = 'Inter';

// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const C = {

function withT(x, y, sc, rot, fn) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(sc, sc); fn(); ctx.restore(); }

// ---------------------------------------------------------------- background

const FANS = [ // sparse locals on the bleachers
  { x: 230, row: 0, c: '#ff6b6b', skin: '#ffdbac' }, { x: 300, row: 2, c: '#4dabf7', skin: '#8d5524' },

function drawStadium(t, o = {}) {

// ---------------------------------------------------------------- characters
// feet at (0,0), ~340px tall at scale 1

function drawPlayer(x, y, s, o = {}) {
  const jersey = o.jersey || C.teal, trim = o.trim || C.orange, skin = o.skin || '#e0ac69';
  const wide = o.wide || 1, run = o.run || 0, flip = o.flip ? -1 : 1;

  ctx.fillStyle = '#f5f5f5';

  ctx.fillStyle = C.orange; rr(-75, -270, 150, 170, 40); ctx.fill();
  ctx.fillStyle = C.teal; ctx.fillRect(-75, -150, 150, 14);

// ---------------------------------------------------------------- HUD (day + fund)
function fundAt(t) {
  const L = sceneLine('profile'), H2 = sceneLine('helmet');
  if (!L || t < L.start) return null;
  let v = 0; const tc = L.start + .78 * (L.end - L.start);
  v = Math.round(12 * eOut(seg(t, tc - .5, tc + .2)));
  if (H2 && t > H2.start + .25 * (H2.end - H2.start)) v = Math.max(0, 12 - Math.round(12 * seg(t, H2.start + .25 * (H2.end - H2.start), H2.start + .45 * (H2.end - H2.start))));
  return v;
}

function fundCont(t) { const L = sceneLine('fund'); if (!L || t < L.start) return 0; let v = 403 * eOut(seg(t, L.start + .2, L.start + 1.4)); const a = absWord('purchase', 'fifty'); if (t > a) v = 403 - 50 * seg(t, a, a + .6); return v; }
function T_FLASH(t) { const L = sceneLine('fund'), a = absWord('purchase', 'fifty'); if (L && t > L.start + 1.4 && t < L.start + 2.2) return 1; if (t > a + .6 && t < a + 1.3) return -1; return 0; }
function rollNum(v, rx, cy, size, col) { const n = Math.max(1, String(Math.floor(v + 1e-6)).length), dw = size * .62, chars = ['$']; for (let p = n - 1; p >= 0; p--) chars.push(p);
  let x = rx - chars.length * dw + dw / 2; ctx.save(); rr(870, 70, 160, 78, 18); ctx.clip();
  for (const c of chars) { if (c === '$') txt('$', x, cy, size, col); else { const pw = Math.pow(10, c), xv = v / pw, dg = Math.floor(xv + 1e-6) % 10, lower = v - Math.floor(v / pw + 1e-6) * pw, roll = c === 0 ? xv - Math.floor(xv + 1e-6) : clamp(lower - (pw - 1));
    txt(String(dg), x, cy - roll * size * 1.15, size, col); if (roll > .01) txt(String((dg + 1) % 10), x, cy + (1 - roll) * size * 1.15, size, col); } x += dw; } ctx.restore(); }
function hud(t) {
  if (TL.lines.find(l => l.cold && t < l.end + 1.1)) return;
  // day badge
  ctx.save(); shadowOn(10, 6); ctx.fillStyle = C.orange; rr(40, 60, 230, 96, 26); ctx.fill(); ctx.shadowColor = 'transparent';

    ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.stroke(); ctx.restore();

    const fc = fundCont(t), dv = fundCont(t + .05) - fundCont(t - .05), live = Math.abs(dv) > .01; if (live || T_FLASH(t)) { const up = live ? dv > 0 : T_FLASH(t) > 0; ctx.fillStyle = up ? 'rgba(31,157,85,.35)' : 'rgba(224,74,58,.35)'; rr(610, 60, 430, 96, 26); ctx.fill(); }

// ---------------------------------------------------------------- captions
function captions(t) {
  const L = TL.lines.find(l => t >= l.start - .05 && t <= l.end + .15); if (!L) return;
  const ws = L.words; let ci = ws.findIndex((w, i) => t >= w.s && (i === ws.length - 1 || t < ws[i + 1].s)); if (ci < 0) ci = 0;
  const CH = 3; const c0 = Math.floor(ci / CH) * CH; const chunk = ws.slice(c0, c0 + CH);
  ctx.save(); ctx.font = `900 84px ${FONT}`;
  const parts = chunk.map(w => w.w.toUpperCase()); const sp = 22;
  const widths = parts.map(p => ctx.measureText(p).width); const total = widths.reduce((a, b) => a + b, 0) + sp * (parts.length - 1);
  const fit = Math.min(1, 960 / total);
  let x = W / 2 - total * fit / 2; const y = 1640;
  parts.forEach((p, i) => { const active = c0 + i === ci; const k = active ? eBack(clamp((t - ws[c0 + i].s) / .12)) : 1;
    withT(x + widths[i] * fit / 2, y, (active ? lerp(.8, 1.08, k) : 1) * fit, 0, () => txt(p, 0, 0, 84, active ? C.yellow : '#fff', { stroke: 16 }));
    x += (widths[i] + sp) * fit; });
  ctx.restore();
}
