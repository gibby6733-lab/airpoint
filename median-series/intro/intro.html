<script>
const DUR=31.94, FPS=60;
window.DUR=DUR;
const LYR=[
 [2.7,5.320,"BAND","♪ Median! Median! Right in the middle! ♪"],
 [5.32,7.452,"DEX","♪ This is gonna change the world— ♪"],
 [7.452,8.866,"WREN","♪ —it's gonna change a little. ♪"],
 [8.866,11.874,"BAND","♪ Median! Median! Average and proud! ♪"],
 [11.874,13.509,"MARCUS","♪ Everything's on sale today— ♪"],
 [13.509,15.475,"GORDY","♪ —and someone's watching from the cloud! ♪"],
 [15.475,18.919,"BAND","♪ Median! Median! America tries it first! ♪"],
 [18.919,21.953,"KENZIE","♪ Like and subscribe or it's literally the worst! ♪"],
 [21.953,26.244,"TUNK","(calm, off-key) Grandpa says don't eat the hill… the hill eats first."],
 [26.244,29.432,"BAND","♪ Median! Median! Neither here nor there! ♪"],
 [29.562,30.761,"ALL","♪ MEDIAN! ♪"]
];
const SCN={"s1": [0, 2.7], "s2": [2.7, 5.32], "s3": [5.32, 8.866], "s4": [8.866, 11.874], "s5": [11.874, 15.475], "s6": [15.475, 18.919], "s7": [18.919, 21.953], "s8": [21.953, 26.244], "s9": [26.244, 29.362000000000002], "s10": [29.362000000000002, 31.94]};
const GO=1.635;

const $=id=>document.getElementById(id);
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const bounce=(t,f=2.2,a=10)=>Math.abs(Math.sin(t*Math.PI*f))*a; // beat bounce (~132bpm)
// build corn rows
function corn(g,y0,n,scale){let s='';for(let r=0;r<n;r++){for(let i=0;i<26;i++){const x=i*80+(r%2)*40-20, y=y0+r*60;s+=`<g class="stalk" transform="translate(${x},${y}) scale(${scale})"><path d="M0,0 V-90" stroke="#6E7A4C" stroke-width="8"/><path d="M0,-40 q-30,-10 -40,-40 M0,-60 q30,-10 40,-40" stroke="#8C9670" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="6" cy="-70" rx="9" ry="20" fill="#E3B75C"/></g>`;}}g.innerHTML=s;}
corn($('corn1'),620,3,0.8); corn($('corn4'),880,4,1.2);
// products on endcap
(function(){let s='';const c=['#FF2E93','#22E5FF','#B6FF3B','#9B5CFF'];for(let r=0;r<3;r++)for(let i=0;i<4;i++){s+=`<rect class="prod" x="${-300+i*155}" y="${-220+r*170}" width="110" height="130" rx="14" fill="${c[(i+r)%4]}" stroke="#2B2118" stroke-width="5"/>`;}$('prods').innerHTML=s;})();
(function(){let s='';for(let i=0;i<24;i++)s+=`<rect x="${i*90-40}" y="0" width="45" height="1080" fill="${i%2?'#9B5CFF':'#C9B48F'}" transform="skewX(-20)"/>`;$('stripes').innerHTML=s;})();
const lineupH=[0.88,0.96,1.00,1.04,1.06,1.10];

window.renderAt=function(t){
  const L=id=>{const r=SCN[id];return (t>=r[0]&&t<r[1])?t-r[0]:null;}; const D=id=>SCN[id][1]-SCN[id][0];
  for(const id in SCN){$(id).style.display=L(id)!==null||(id==='s10'&&t>=SCN.s10[0])?'block':'none';}
  // captions
  const Y=LYR.find(l=>t>=l[0]&&t<l[1]);const cap=$('cap');
  if(Y&&Y[3]){cap.style.display='block';cap.innerHTML=(Y[2]?`<b>${Y[2]}</b>`:'')+Y[3];}else cap.style.display='none';
  // S1: car drives past, pop sign flips 4,812 -> 4,813 -> 4,812
  if(L('s1')!==null){const k=L('s1')/D('s1');$('car').setAttribute('transform',`translate(${-300+k*2400},${830+Math.sin(t*20)*3})`);
    $('pop').textContent = (t>1.2&&t<2.2)?'4,813':'4,812';}
  // S2: pan across downtown, neon pulses
  if(L('s2')!==null){const k=ease(L('s2')/D('s2'));$('town').style.transform=`translateX(${-k*1280}px)`;$('neon').setAttribute('opacity',0.6+0.4*Math.abs(Math.sin(t*6)));}
  // S3: Dex bounces on the beat; Wren still (the joke)
  if(L('s3')!==null){const lt=L('s3');$('dex3').style.transform=`translateY(${-bounce(lt,2.2,22)}px) rotate(${Math.sin(lt*6)*2}deg)`;
    $('wren3').style.transform=`scale(${1+0.008*Math.sin(lt*2.4)},${1+0.012*Math.sin(lt*2.4)})`;}
  // S4: cube glow pulses, corn sways
  if(L('s4')!==null){const lt=L('s4');$('cubeglow').setAttribute('opacity',0.5+0.5*Math.sin(lt*4));
    document.querySelectorAll('#corn4 .stalk').forEach((s,i)=>{const tr=s.getAttribute('transform').replace(/ rotate\(.*\)/,'');s.setAttribute('transform',tr+` rotate(${Math.sin(lt*3+i*.3)*4})`);});}
  // S5: eye in the mirror opens when Gordy sings, pupil darts
  if(L('s5')!==null){const lt=L('s5');$('marcus5').style.transform=`translateY(${-bounce(lt,2.2,10)}px)`;
    $('gordy5').style.transform=`translateY(${lt>GO-0.1?-bounce(lt,2.2,16):0}px)`;
    const open=lt<GO-0.2?0:ease((lt-GO+0.2)/0.3);$('eye5').setAttribute('opacity',open);
    $('pupil5').setAttribute('cx',lt>GO+0.6?-40:20);
    $('lid5').setAttribute('height',(lt>GO+1.0&&lt<GO+1.15)?120:0);}
  // S6: products pop in on the beat
  if(L('s6')!==null){const lt=L('s6');document.querySelectorAll('.prod').forEach((p,i)=>{const s=ease((lt*4-i*0.25));p.setAttribute('opacity',s);});
    $('endcap').setAttribute('transform',`translate(960,560) scale(${1+0.02*Math.sin(lt*14)})`);}
  // S7: follower counter climbs
  if(L('s7')!==null){const lt=L('s7')/D('s7');const n=Math.round(2304+Math.pow(lt,3)*997696);$('fol').textContent=n.toLocaleString('en-US');
    $('kenzie7').style.transform=`translateY(${-bounce(t,2.2,14)}px)`;}
  // S8: Tunk still; the hill opens an eye
  if(L('s8')!==null){const lt=L('s8');$('tunk8').style.transform=`scale(${1+0.006*Math.sin(lt*1.8)},${1+0.010*Math.sin(lt*1.8)})`;const e=$('hilleye');const o=lt<D('s8')*0.55?0:ease((lt-D('s8')*0.55)/0.4);
    e.children[0].setAttribute('ry',34*o);e.children[1].setAttribute('r',14*o);
    document.querySelectorAll('#junk *').forEach((j,i)=>j.setAttribute('opacity',0.5+0.5*Math.abs(Math.sin(lt*3+i))));}
  // S9: cast pops in one by one, neon flickers, Frink appears in window
  if(L('s9')!==null){const lt=L('s9');const imgs=document.querySelectorAll('#s9 .ch');let x=70;
    imgs.forEach((im,i)=>{const h=Math.round(600*lineupH[i]/1.10);im.style.height=h+'px';im.style.left=(0+i*282)+'px';im.style.bottom='170px';
      const s=ease((lt-i*0.22)/0.35);im.style.transform=`translateY(${(1-s)*400}px) translateY(${-bounce(lt,2.2,8)}px)`;});
    $('neon9').setAttribute('opacity',((lt%1.3)<0.07||(lt>1.62&&lt<1.7))?0.25:1);$('frinksil').setAttribute('opacity',lt>2?1:0);}
  // S10: logo slams in, stamp lands
  if(t>=SCN.s10[0]){const lt=t-SCN.s10[0];const s=ease(lt/0.35);$('logo').setAttribute('transform',`translate(960,470) scale(${0.6+0.4*s})`);$('logo').setAttribute('opacity',s);
    $('stripes').setAttribute('transform',`translate(${lt*60},0)`);
    const st=lt<1.6?0:ease((lt-1.6)/0.15);$('stamp').setAttribute('opacity',st);$('stamp').setAttribute('transform',`translate(1500,820) rotate(-12) scale(${1.6-0.6*st})`);}
};
window.renderAt(0);
</script>
