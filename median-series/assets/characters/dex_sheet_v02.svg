<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- MEDIAN — DEX PRUITT — reference sheet v02 (matches the approved Z Image look) -->
  <defs>
    <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grown"/>
      <feFlood flood-color="#FFFFFF"/>
      <feComposite in2="grown" operator="in" result="rim"/>
      <feGaussianBlur in="grown" stdDeviation="4" result="soft"/>
      <feFlood flood-color="#C9B48F" flood-opacity="0.35"/>
      <feComposite in2="soft" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ol { stroke:#3A2A1E; stroke-width:3.5; stroke-linejoin:round; stroke-linecap:round; }
      .skin{fill:#F6CBA6}.skinS{fill:#E7AE87}.blush{fill:#F2A08E;opacity:.55}
      .hair{fill:#F2D27A}.hairS{fill:#DDB65A}
      .brow{fill:#6B4226}
      .blazer{fill:#55575E}.blazerS{fill:#43454B}
      .hoodie{fill:#C8392F}.hoodieS{fill:#A82E26}
      .chino{fill:#B98F5E}.chinoS{fill:#9E784B}.cuff{fill:#CFA877}
      .shoe{fill:#FFFFFF}.sole{fill:#E9E4DA}.stripe{fill:#C8392F}
      .phone{fill:#2F3238}.phoneL{fill:#4A4E57}
      .ink{fill:#2B2118}.white{fill:#FFFFFF}
      .label{font:700 26px 'Helvetica Neue',Arial,sans-serif;fill:#3A2A1E;letter-spacing:2px}
      .small{font:600 16px 'Helvetica Neue',Arial,sans-serif;fill:#7A6A58;letter-spacing:1px}
    </style>

    <!-- ===== FRONT HEAD BASE (no face). origin: head center x=0, hair top ~y=0 ===== -->
    <g id="headFrontBase">
      <!-- headphone band (behind hair) -->
      <path fill="none" stroke="#2F3238" stroke-width="18" stroke-linecap="round" d="M-116,176 Q-124,8 0,4 Q124,8 116,176"/>
      <!-- head -->
      <rect class="skin ol" x="-102" y="62" width="204" height="222" rx="92"/>
      <!-- hair quiff -->
      <path class="hair ol" d="M-104,172 Q-116,96 -72,64 Q-74,28 -36,30 Q-24,-4 12,14 Q40,-10 62,22 Q100,18 94,62 Q122,90 104,172 Q96,128 52,118 Q8,108 -30,124 Q-74,140 -104,172Z"/>
      <path class="hairS" d="M-60,70 Q-20,40 30,46 Q-10,56 -40,86Z"/>
      <path class="hairS" d="M20,30 Q50,20 70,40 Q48,36 30,50Z"/>
      <!-- headphone cups -->
      <rect class="phone ol" x="-136" y="146" width="40" height="86" rx="20"/>
      <rect class="phoneL" x="-128" y="160" width="16" height="58" rx="8"/>
      <rect class="phone ol" x="96" y="146" width="40" height="86" rx="20"/>
      <rect class="phoneL" x="112" y="160" width="16" height="58" rx="8"/>
      <!-- blush -->
      <ellipse class="blush" cx="-62" cy="222" rx="18" ry="11"/>
      <ellipse class="blush" cx="62" cy="222" rx="18" ry="11"/>
      <!-- nose -->
      <path class="skinS ol" d="M-10,200 Q0,222 10,200 Q8,214 0,216 Q-8,214 -10,200Z" stroke-width="2"/>
    </g>
    <!-- boom mic (front) drawn over face -->
    <g id="micFront">
      <path fill="none" stroke="#2F3238" stroke-width="7" stroke-linecap="round" d="M116,214 Q108,262 56,262"/>
      <ellipse class="phone ol" cx="46" cy="262" rx="14" ry="11"/>
    </g>
    <!-- eyes (white ovals) -->
    <g id="eyesWhite">
      <ellipse class="white ol" cx="-42" cy="176" rx="30" ry="32"/>
      <ellipse class="white ol" cx="42" cy="176" rx="30" ry="32"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#F7EEDD"/>
  <text class="label" x="40" y="54">DEX PRUITT — MODEL SHEET v02</text>
  <text class="small" x="40" y="80">MEDIAN · locked design · height index 1.10 · line-up position 6 of 6</text>

  <!-- ================= FRONT VIEW ================= -->
  <g id="DEX-front" filter="url(#sticker)" transform="translate(330,120)">
    <!-- legs -->
    <rect class="chino ol" x="-64" y="468" width="58" height="150" rx="10"/>
    <rect class="chino ol" x="6" y="468" width="58" height="150" rx="10"/>
    <rect class="chinoS" x="-20" y="474" width="9" height="120" rx="4"/>
    <rect class="chinoS" x="50" y="474" width="9" height="120" rx="4"/>
    <rect class="cuff ol" x="-68" y="596" width="66" height="22" rx="6"/>
    <rect class="cuff ol" x="2" y="596" width="66" height="22" rx="6"/>
    <!-- shoes -->
    <path class="shoe ol" d="M-84,650 Q-86,620 -60,618 h52 q14,0 14,16 v16z"/>
    <path class="shoe ol" d="M84,650 Q86,620 60,618 h-52 q-14,0 -14,16 v16z"/>
    <rect class="sole ol" x="-88" y="646" width="86" height="14" rx="6"/>
    <rect class="sole ol" x="2" y="646" width="86" height="14" rx="6"/>
    <path class="stripe" d="M-70,628 q20,-8 42,-4 l-2,6 q-20,-4 -38,4z"/>
    <path class="stripe" d="M70,628 q-20,-8 -42,-4 l2,6 q20,-4 38,4z"/>

    <!-- arms out, palms up ("presenting") -->
    <g id="arm-L">
      <path class="blazer ol" d="M-96,302 Q-150,300 -196,262 L-212,286 Q-160,338 -100,352Z"/>
      <rect class="hoodie ol" x="-232" y="250" width="30" height="40" rx="10" transform="rotate(-50 -217 270)"/>
      <g transform="translate(-246,236) rotate(-30)">
        <rect class="skin ol" x="-30" y="-14" width="60" height="40" rx="18"/>
        <rect class="skin ol" x="-30" y="-44" width="13" height="34" rx="6.5"/>
        <rect class="skin ol" x="-15" y="-50" width="13" height="40" rx="6.5"/>
        <rect class="skin ol" x="0" y="-48" width="13" height="38" rx="6.5"/>
        <rect class="skin ol" x="15" y="-40" width="12" height="30" rx="6"/>
        <rect class="skin" x="-26" y="-16" width="50" height="16"/>
        <ellipse class="skin ol" cx="32" cy="12" rx="9" ry="15" transform="rotate(40 32 12)"/>
      </g>
    </g>
    <g id="arm-R">
      <path class="blazer ol" d="M96,302 Q150,300 196,262 L212,286 Q160,338 100,352Z"/>
      <rect class="hoodie ol" x="202" y="250" width="30" height="40" rx="10" transform="rotate(50 217 270)"/>
      <g transform="translate(246,236) rotate(30) scale(-1,1)">
        <rect class="skin ol" x="-30" y="-14" width="60" height="40" rx="18"/>
        <rect class="skin ol" x="-30" y="-44" width="13" height="34" rx="6.5"/>
        <rect class="skin ol" x="-15" y="-50" width="13" height="40" rx="6.5"/>
        <rect class="skin ol" x="0" y="-48" width="13" height="38" rx="6.5"/>
        <rect class="skin ol" x="15" y="-40" width="12" height="30" rx="6"/>
        <rect class="skin" x="-26" y="-16" width="50" height="16"/>
        <ellipse class="skin ol" cx="32" cy="12" rx="9" ry="15" transform="rotate(40 32 12)"/>
      </g>
    </g>

    <!-- torso -->
    <rect class="hoodie ol" x="-74" y="290" width="148" height="186" rx="22"/>
    <path class="hoodieS ol" d="M-46,410 h92 l10,52 h-112z"/>
    <path class="blazer ol" d="M-112,318 Q-112,292 -76,290 L-26,296 L-34,482 h-70 q-10,0 -10,-12z"/>
    <path class="blazer ol" d="M112,318 Q112,292 76,290 L26,296 L34,482 h70 q10,0 10,-12z"/>
    <path class="blazerS ol" d="M-26,296 L-60,300 L-46,330 L-62,340 L-34,410z"/>
    <path class="blazerS ol" d="M26,296 L60,300 L46,330 L62,340 L34,410z"/>
    <path class="blazerS ol" d="M-104,420 h50 v14 h-50z"/>
    <path class="blazerS ol" d="M54,420 h50 v14 h-50z"/>
    <!-- hood around neck -->
    <path class="hoodie ol" d="M-86,296 Q0,248 86,296 Q60,318 30,312 Q0,304 -30,312 Q-60,318 -86,296Z"/>
    <path class="ol" fill="none" d="M-14,310 v40 M14,310 v40"/>

    <!-- head -->
    <g transform="translate(0,0)">
      <use xlink:href="#headFrontBase"/>
      <use xlink:href="#eyesWhite"/>
      <circle class="ink" cx="-38" cy="180" r="10"/>
      <circle class="ink" cx="38" cy="180" r="10"/>
      <!-- determined brows -->
      <path class="brow ol" stroke-width="2.5" d="M-76,140 Q-44,126 -12,146 L-16,158 Q-46,142 -74,154Z"/>
      <path class="brow ol" stroke-width="2.5" d="M76,140 Q44,126 12,146 L16,158 Q46,142 74,154Z"/>
      <!-- smirk -->
      <path class="ol" fill="none" d="M-30,244 Q2,256 34,238"/>
      <use xlink:href="#micFront"/>
    </g>
  </g>
  <text class="small" x="300" y="830">FRONT</text>

  <!-- ================= SIDE VIEW (facing left) ================= -->
  <g id="DEX-side" filter="url(#sticker)" transform="translate(760,120)">
    <!-- back leg + front leg -->
    <rect class="chinoS ol" x="-20" y="468" width="56" height="150" rx="10"/>
    <rect class="chino ol" x="-34" y="468" width="58" height="150" rx="10"/>
    <rect class="cuff ol" x="-38" y="596" width="66" height="22" rx="6"/>
    <path class="shoe ol" d="M-86,650 Q-88,622 -60,618 h82 q10,0 10,14 v18z"/>
    <rect class="sole ol" x="-92" y="646" width="128" height="14" rx="6"/>
    <path class="stripe" d="M-62,628 q30,-8 64,-2 l-2,6 q-30,-6 -60,2z"/>
    <!-- torso -->
    <path class="hoodie ol" d="M-58,292 h104 q20,0 22,22 l6,160 h-140 l-6,-160 q0,-22 14,-22z"/>
    <path class="blazer ol" d="M-64,300 q0,-10 12,-10 h96 q22,0 24,24 l6,168 h-136z"/>
    <path class="blazerS ol" d="M-64,330 l30,12 l-12,40 z"/>
    <path class="blazerS ol" d="M-40,420 h44 v14 h-44z"/>
    <!-- hood bunched at back of neck -->
    <path class="hoodie ol" d="M10,270 Q80,262 84,320 Q74,348 50,340 Q40,300 6,300z"/>
    <path class="ol" fill="none" stroke-width="2.5" d="M-48,300 q-4,30 2,56"/>
    <!-- arm hanging -->
    <path class="blazer ol" d="M-2,304 q30,0 32,30 l4,124 q0,10 -10,10 h-34 q-10,0 -10,-10 l2,-124 q2,-30 16,-30z"/>
    <rect class="hoodie ol" x="-14" y="454" width="40" height="22" rx="8"/>
    <rect class="skin ol" x="-14" y="470" width="40" height="44" rx="18"/>
    <path class="ol" fill="none" stroke-width="2.5" d="M-6,496 h24 M-6,506 h22"/>
    <!-- head (profile) -->
        <path class="skin ol" d="M-86,150 Q-96,70 -20,58 L50,58 Q104,62 104,150 L104,200 Q104,284 20,284 L-30,284 Q-70,284 -82,240 L-90,232 Q-106,222 -96,206 L-88,198 Z"/>
    <!-- nose bump -->
    <path class="skin ol" d="M-88,196 Q-112,190 -104,172 Q-96,164 -86,170"/>
    <path class="hair ol" d="M-82,140 Q-96,72 -40,52 Q-34,18 4,22 Q30,-4 60,22 Q98,20 98,62 Q124,94 106,170 Q92,120 56,118 Q20,110 -10,118 Q-50,124 -82,140Z"/>
    <path class="hairS" d="M-30,58 Q10,34 52,42 Q12,52 -12,74Z"/>
    <!-- eye, brow, blush, mouth -->
    <ellipse class="white ol" cx="-54" cy="174" rx="20" ry="30"/>
    <circle class="ink" cx="-62" cy="178" r="9"/>
    <path class="brow ol" stroke-width="2.5" d="M-82,138 Q-56,126 -30,140 L-34,152 Q-56,140 -80,150Z"/>
    <ellipse class="blush" cx="-36" cy="222" rx="16" ry="10"/>
    <path class="ol" fill="none" d="M-86,246 Q-70,252 -58,244"/>
    <!-- headphone band over the head + cup + mic -->
    <path fill="none" stroke="#2F3238" stroke-width="18" stroke-linecap="round" d="M26,150 Q20,60 30,8"/>
    <ellipse class="phone ol" cx="26" cy="186" rx="40" ry="48"/>
    <ellipse class="phoneL" cx="26" cy="186" rx="22" ry="28"/>
    <path fill="none" stroke="#2F3238" stroke-width="7" stroke-linecap="round" d="M-6,214 Q-34,262 -78,258"/>
    <ellipse class="phone ol" cx="-86" cy="256" rx="14" ry="11"/>
  </g>
  <text class="small" x="740" y="830">SIDE</text>

  <!-- ================= EXPRESSIONS ================= -->
  <text class="small" x="1060" y="130">EXPRESSIONS</text>
  <!-- 1 smug -->
  <g filter="url(#sticker)" transform="translate(1160,160) scale(0.62)">
    <use xlink:href="#headFrontBase"/><use xlink:href="#eyesWhite"/>
    <path class="skin" d="M-74,152 Q-42,140 -10,152 L-10,170 L-74,170Z"/><path class="ol" fill="none" d="M-74,160 Q-42,150 -10,160"/>
    <path class="skin" d="M74,152 Q42,140 10,152 L10,170 L74,170Z"/><path class="ol" fill="none" d="M74,160 Q42,150 10,160"/>
    <circle class="ink" cx="-36" cy="184" r="9"/><circle class="ink" cx="48" cy="184" r="9"/>
    <path class="brow ol" stroke-width="2.5" d="M-76,128 Q-44,118 -12,130 L-14,142 Q-44,132 -74,140Z"/>
    <path class="brow ol" stroke-width="2.5" d="M76,118 Q44,106 12,124 L14,136 Q44,120 74,130Z"/>
    <path class="white ol" d="M-34,238 Q10,252 44,228 Q36,258 4,260 Q-24,258 -34,238Z"/>
    <use xlink:href="#micFront"/>
  </g>
  <text class="small" x="1128" y="370">SMUG</text>
  <!-- 2 revelation -->
  <g filter="url(#sticker)" transform="translate(1420,160) scale(0.62)">
    <use xlink:href="#headFrontBase"/>
    <ellipse class="white ol" cx="-42" cy="172" rx="34" ry="38"/><ellipse class="white ol" cx="42" cy="172" rx="34" ry="38"/>
    <circle class="ink" cx="-42" cy="172" r="6"/><circle class="ink" cx="42" cy="172" r="6"/>
    <path class="brow ol" stroke-width="2.5" d="M-78,112 Q-46,92 -14,108 L-16,120 Q-46,106 -76,124Z"/>
    <path class="brow ol" stroke-width="2.5" d="M78,112 Q46,92 14,108 L16,120 Q46,106 76,124Z"/>
    <ellipse class="ink" cx="0" cy="248" rx="10" ry="12"/>
    <use xlink:href="#micFront"/>
  </g>
  <text class="small" x="1372" y="370">REVELATION</text>
  <!-- 3 betrayed -->
  <g filter="url(#sticker)" transform="translate(1160,470) scale(0.62)">
    <use xlink:href="#headFrontBase"/><use xlink:href="#eyesWhite"/>
    <circle class="ink" cx="-42" cy="170" r="7"/><circle class="ink" cx="42" cy="170" r="7"/>
    <path class="brow ol" stroke-width="2.5" d="M-76,142 Q-44,118 -12,122 L-14,134 Q-44,132 -74,154Z"/>
    <path class="brow ol" stroke-width="2.5" d="M76,142 Q44,118 12,122 L14,134 Q44,132 74,154Z"/>
    <path class="ink" d="M-26,256 Q0,226 26,256 Q0,246 -26,256Z"/>
    <path fill="#C8392F" d="M-14,252 Q0,244 14,252 Q0,250 -14,252Z"/>
    <use xlink:href="#micFront"/>
  </g>
  <text class="small" x="1112" y="680">BETRAYED</text>
  <!-- 4 deflated -->
  <g filter="url(#sticker)" transform="translate(1420,470) scale(0.62)">
    <use xlink:href="#headFrontBase"/><use xlink:href="#eyesWhite"/>
    <path class="skin" d="M-74,146 h64 v36 h-64z"/><path class="ol" fill="none" d="M-74,180 Q-42,174 -10,180"/>
    <path class="skin" d="M74,146 h-64 v36 h64z"/><path class="ol" fill="none" d="M74,180 Q42,174 10,180"/>
    <circle class="ink" cx="-40" cy="194" r="8"/><circle class="ink" cx="40" cy="194" r="8"/>
    <path class="brow ol" stroke-width="2.5" d="M-76,150 Q-44,140 -12,134 L-12,146 Q-44,152 -74,162Z"/>
    <path class="brow ol" stroke-width="2.5" d="M76,150 Q44,140 12,134 L12,146 Q44,152 74,162Z"/>
    <path class="ol" fill="none" d="M-22,250 Q0,240 22,250"/>
    <use xlink:href="#micFront"/>
  </g>
  <text class="small" x="1380" y="680">DEFLATED</text>

  <!-- color callouts -->
  <g transform="translate(40,760)">
    <text class="small" x="0" y="0">PALETTE</text>
    <g transform="translate(0,14)">
      <rect x="0" width="44" height="28" rx="6" fill="#F2D27A" stroke="#3A2A1E"/><rect x="54" width="44" height="28" rx="6" fill="#F6CBA6" stroke="#3A2A1E"/>
      <rect x="108" width="44" height="28" rx="6" fill="#55575E" stroke="#3A2A1E"/><rect x="162" width="44" height="28" rx="6" fill="#C8392F" stroke="#3A2A1E"/>
      <rect x="216" width="44" height="28" rx="6" fill="#B98F5E" stroke="#3A2A1E"/><rect x="270" width="44" height="28" rx="6" fill="#2F3238" stroke="#3A2A1E"/>
      <rect x="324" width="44" height="28" rx="6" fill="#6B4226" stroke="#3A2A1E"/>
    </g>
  </g>
</svg>
