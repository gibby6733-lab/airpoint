<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 820" width="500" height="820">
  <!-- MEDIAN — DEX PRUITT — front view, vector master v01 -->
  <defs>
    <!-- White "sticker rim" around the full silhouette -->
    <filter id="sticker" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="grown"/>
      <feFlood flood-color="#FFFFFF"/>
      <feComposite in2="grown" operator="in" result="rim"/>
      <feMerge><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ol { stroke:#2B2118; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
      .skin { fill:#F2C9A5; } .skinS { fill:#D9AA86; }
      .hair { fill:#E3B75C; } .hairS { fill:#C99A3E; }
      .blazer { fill:#3C3F47; } .blazerS { fill:#2C2E34; }
      .hoodie { fill:#D6453D; } .hoodieS { fill:#B1342D; }
      .chino { fill:#C8B08A; } .chinoS { fill:#A99270; }
      .shoe { fill:#FFFFFF; } .lace { stroke:#D6453D; stroke-width:4; stroke-linecap:round; fill:none; }
      .ink { fill:#2B2118; }
    </style>
  </defs>

  <g id="DEX" filter="url(#sticker)">
    <!-- LEGS -->
    <g id="legs">
      <rect class="chino ol" x="200" y="610" width="44" height="110" rx="14"/>
      <rect class="chino ol" x="256" y="610" width="44" height="110" rx="14"/>
      <rect class="chinoS" x="232" y="616" width="9" height="100" rx="4"/>
      <rect class="chinoS" x="288" y="616" width="9" height="100" rx="4"/>
    </g>
    <!-- SHOES -->
    <g id="shoes">
      <path class="shoe ol" d="M188,712 h58 q10,0 10,14 v8 q0,10 -12,10 h-62 q-12,0 -10,-12 q2,-20 16,-20z"/>
      <path class="shoe ol" d="M254,712 h58 q14,0 16,20 q2,12 -10,12 h-62 q-12,0 -12,-10 v-8 q0,-14 10,-14z"/>
      <path class="lace" d="M206,722 l14,8 M206,732 l14,-8"/>
      <path class="lace" d="M280,722 l14,8 M280,732 l14,-8"/>
    </g>

    <!-- LEFT ARM (viewer's left, hanging) -->
    <g id="arm-left">
      <path class="blazer ol" d="M160,455 q-30,10 -36,70 l-4,50 q0,10 12,12 l26,2 q10,0 12,-10 l8,-80z"/>
      <rect class="hoodie ol" x="114" y="565" width="44" height="28" rx="10"/>
      <ellipse class="skin ol" cx="134" cy="612" rx="22" ry="24"/>
      <path class="ol" fill="none" d="M146,600 q8,4 6,14"/>
    </g>

    <!-- RIGHT ARM (viewer's right, raised like presenting a slide) -->
    <g id="arm-right">
      <path class="blazer ol" d="M335,460 q34,0 50,-36 l20,-46 q4,-10 -6,-16 l-22,-10 q-10,-4 -14,6 l-22,50 q-10,22 -26,22z"/>
      <rect class="hoodie ol" x="380" y="330" width="40" height="30" rx="10" transform="rotate(24 400 345)"/>
      <!-- open mitten hand, four fingers -->
      <g transform="translate(414,298) rotate(18)">
        <rect class="skin ol" x="-27" y="-46" width="13" height="34" rx="6.5"/>
        <rect class="skin ol" x="-13" y="-52" width="13" height="40" rx="6.5"/>
        <rect class="skin ol" x="1" y="-50" width="13" height="38" rx="6.5"/>
        <rect class="skin ol" x="15" y="-42" width="12" height="30" rx="6"/>
        <ellipse class="skin ol" cx="-30" cy="4" rx="9" ry="16" transform="rotate(-35 -30 4)"/>
        <rect class="skin ol" x="-28" y="-22" width="56" height="44" rx="20"/>
      </g>
    </g>

    <!-- TORSO: red hoodie under oversized charcoal blazer -->
    <g id="torso">
      <path class="hoodie ol" d="M190,440 h120 q22,0 22,24 v140 q0,14 -14,14 h-136 q-14,0 -14,-14 v-140 q0,-24 22,-24z"/>
      <!-- blazer body: wide shoulders, open front -->
      <path class="blazer ol" d="M150,462 q0,-26 40,-28 l42,6 l-8,184 h-64 q-14,0 -14,-14z"/>
      <path class="blazer ol" d="M350,462 q0,-26 -40,-28 l-42,6 l8,184 h64 q14,0 14,-14z"/>
      <!-- lapels -->
      <path class="blazerS ol" d="M232,440 l-30,4 l22,70z"/>
      <path class="blazerS ol" d="M268,440 l30,4 l-22,70z"/>
      <!-- hoodie strings -->
      <path class="ol" fill="none" d="M240,456 v44 M260,456 v44"/>
      <circle class="ink" cx="240" cy="503" r="4"/><circle class="ink" cx="260" cy="503" r="4"/>
      <!-- blazer buttons + pocket -->
      <circle class="ink" cx="214" cy="560" r="4"/><circle class="ink" cx="214" cy="586" r="4"/>
      <path class="ol" fill="none" d="M296,580 h34"/>
    </g>

    <!-- HOOD outside the collar (behind neck) -->
    <path id="hood" class="hoodie ol" d="M182,438 q68,-30 136,0 q-10,22 -30,22 h-76 q-20,0 -30,-22z"/>

    <!-- HEAD -->
    <g id="head">
      <!-- ears -->
      <ellipse class="skin ol" cx="138" cy="318" rx="18" ry="24"/>
      <ellipse class="skin ol" cx="362" cy="318" rx="18" ry="24"/>
      <!-- back of hair (behind head, fills gaps under the swoop) -->
      <path class="hair ol" d="M146,284 Q128,168 250,146 Q376,158 364,284Z"/>
      <!-- soft rounded-rectangle head -->
      <rect class="skin ol" x="140" y="180" width="220" height="252" rx="96"/>
      <!-- cowlick: sticks straight up at the back (drawn first so swoop overlaps base) -->
      <!-- hair: tall swoop -->
      <path id="hair" class="hair ol" d="M142,292 Q116,176 186,132 Q262,88 346,118 Q392,140 362,262 Q352,190 306,172 Q244,166 204,206 Q170,236 142,292Z"/>
      <!-- cowlick: sticks straight up at the back of the head -->
      <path id="cowlick" class="hair ol" d="M244,110 Q236,64 252,40 Q262,70 262,108Z"/>
      <path class="hairS" d="M196,150 Q266,112 336,132 Q276,130 222,166Z"/>
      <path class="ol" fill="none" d="M232,124 Q270,116 300,128"/>
      <!-- brows: thick, floating, confident -->
      <path class="ink" d="M176,252 q30,-16 60,-4 l-2,10 q-28,-8 -56,4z"/>
      <path class="ink" d="M264,248 q30,-12 60,4 l-2,10 q-28,-12 -56,-4z"/>
      <!-- eyes: white ovals, tilted up, heavy-lidded -->
      <g id="eye-left" transform="rotate(-8 206 304)">
        <ellipse fill="#FFFFFF" class="ol" cx="206" cy="304" rx="28" ry="36"/>
        <circle class="ink" cx="212" cy="312" r="7"/>
        <path class="skin ol" d="M176,296 q30,-22 60,0 q-30,-6 -60,0z"/>
      </g>
      <g id="eye-right" transform="rotate(8 294 304)">
        <ellipse fill="#FFFFFF" class="ol" cx="294" cy="304" rx="28" ry="36"/>
        <circle class="ink" cx="300" cy="312" r="7"/>
        <path class="skin ol" d="M264,296 q30,-22 60,0 q-30,-6 -60,0z"/>
      </g>
      <!-- nose -->
      <path class="skinS" d="M238,344 q12,18 24,0 q-4,12 -12,12 q-8,0 -12,-12z"/>
      <!-- mouth: smug lopsided grin -->
      <path fill="#FFFFFF" class="ol" d="M208,380 q46,26 92,-10 q-6,30 -44,34 q-34,2 -48,-24z"/>
      <path class="ol" fill="none" d="M300,370 q8,-4 10,-12"/>
    </g>

    <!-- HEADSET: earpiece + boom mic with foam ball + loose cable to nothing -->
    <g id="headset">
      <rect class="ink" x="120" y="296" width="24" height="44" rx="10"/>
      <path fill="none" stroke="#2B2118" stroke-width="6" stroke-linecap="round" d="M140,330 q20,58 66,56"/>
      <circle class="ink" cx="210" cy="386" r="11"/>
      <path fill="none" stroke="#2B2118" stroke-width="3" stroke-linecap="round" d="M126,340 q-30,60 4,110 q20,30 -6,70"/>
      <rect class="ink" x="118" y="518" width="12" height="16" rx="2"/>
      <path stroke="#2B2118" stroke-width="2" d="M121,534 v6 M127,534 v6"/>
    </g>
  </g>
</svg>
