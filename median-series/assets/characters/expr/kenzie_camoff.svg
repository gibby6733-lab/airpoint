    <path class="brow ol" stroke-width="2" d="M-74,128 Q-44,108 -14,124 L-16,132 Q-44,120 -72,136Z"/><path class="brow ol" stroke-width="2" d="M74,128 Q44,108 14,124 L16,132 Q44,120 72,136Z"/>
    <path class="ink" d="M-34,238 Q0,250 34,238 Q30,272 0,272 Q-30,272 -34,238Z"/><path class="white" d="M-28,240 Q0,250 28,240 v8 Q0,256 -28,248z"/>
  </g><text class="small" x="1108" y="370">CAMERA ON</text>
  <g filter="url(#sticker)" transform="translate(1410,160) scale(0.62)">
    <use xlink:href="#kenzieHead"/><use xlink:href="#kenzieEyes"/><use xlink:href="#kenzieLashes"/>
    <path class="skin" d="M-74,140 h64 v40 Q-42,174 -74,180Z"/><path class="ol" fill="none" d="M-74,178 Q-42,172 -10,178"/>
    <path class="skin" d="M74,140 h-64 v40 Q42,174 74,180Z"/><path class="ol" fill="none" d="M74,178 Q42,172 10,178"/>
    <circle class="ink" cx="-42" cy="192" r="10"/><circle class="ink" cx="42" cy="192" r="10"/>
    <path class="brow ol" stroke-width="2" d="M-74,140 Q-44,138 -14,142 L-14,150 Q-44,146 -74,148Z"/><path class="brow ol" stroke-width="2" d="M74,140 Q44,138 14,142 L14,150 Q44,146 74,148Z"/>
    <path class="ol" fill="none" d="M-18,250 H18"/>
  </g><text class="small" x="1364" y="370">CAMERA OFF</text>
  <g filter="url(#sticker)" transform="translate(1150,470) scale(0.62)">
    <use xlink:href="#kenzieHead"/><use xlink:href="#kenzieEyes"/><use xlink:href="#kenzieLashes"/>
    <circle class="ink" cx="-42" cy="178" r="4"/><circle class="ink" cx="42" cy="178" r="4"/>
    <path class="brow ol" stroke-width="2" d="M-74,116 Q-44,96 -14,112 L-16,120 Q-44,108 -72,124Z"/><path class="brow ol" stroke-width="2" d="M74,116 Q44,96 14,112 L16,120 Q44,108 72,124Z"/>
