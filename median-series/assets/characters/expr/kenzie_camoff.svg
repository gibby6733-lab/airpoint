    <rect class="jean ol" x="-46" y="440" width="104" height="26" rx="6"/>
    <rect class="tank ol" x="-44" y="296" width="98" height="150" rx="18"/>
    <path class="puffer ol" d="M-58,300 Q-60,286 -40,286 h80 Q74,288 76,320 L80,412 Q20,424 -54,412 Q-66,360 -58,300Z"/>
    <path class="ol" fill="none" stroke-width="2.5" d="M-60,340 Q10,352 78,340 M-62,376 Q10,388 80,376"/>
    <!-- arm forward holding phone at face height -->
    <path class="puffer ol" d="M-6,300 Q30,300 30,340 L28,370 Q20,392 -4,392 L-80,300 Q-94,284 -82,272 Q-70,262 -58,276 L-8,334z"/>
    <ellipse class="skin ol" cx="-88" cy="266" rx="16" ry="17"/>
    <circle fill="url(#ringGlow)" cx="-120" cy="210" r="80"/>
    <rect class="dev ol" x="-128" y="196" width="18" height="92" rx="6" transform="rotate(-12 -119 242)"/>
    <ellipse fill="#FFFFFF" class="ol" stroke-width="2" cx="-126" cy="214" rx="5" ry="22" transform="rotate(-12 -119 242)"/>
    <!-- head profile -->
    <path class="hair ol" d="M40,70 Q140,44 156,124 Q166,200 130,256 Q138,186 116,140 Q100,104 52,100Z"/>
    <rect class="scrunch ol" x="36" y="60" width="36" height="30" rx="12" transform="rotate(-20 54 75)"/>
    <path class="skin ol" d="M-86,154 Q-96,76 -20,66 L50,66 Q104,70 104,156 L104,204 Q104,286 20,286 L-30,286 Q-70,286 -82,242 L-90,234 Q-106,224 -96,208 L-88,200 Z"/>
    <path class="skin ol" d="M-88,198 Q-108,194 -102,178 Q-96,170 -86,174"/>
    <ellipse class="skin ol" cx="28" cy="194" rx="15" ry="20"/>
    <path class="hair ol" d="M-88,170 Q-100,70 -10,62 Q96,58 106,160 Q108,190 102,212 Q92,150 56,132 Q0,110 -50,130 Q-74,146 -88,170Z"/>
    <ellipse class="white ol" cx="-60" cy="180" rx="20" ry="32"/><circle class="ink" cx="-68" cy="184" r="10"/><circle class="white" cx="-64" cy="179" r="3.5"/>
    <path class="ol" fill="none" stroke-width="4" d="M-46,158 l10,-8 M-52,150 l6,-12"/>
    <path class="brow ol" stroke-width="2" d="M-86,134 Q-62,116 -38,128 L-40,136 Q-62,126 -84,142Z"/>
    <ellipse class="blush" cx="-38" cy="228" rx="15" ry="9"/>
    <path class="ink" d="M-90,240 Q-74,242 -60,236 Q-64,258 -84,256Z"/>
  </g>
  <text class="small" x="740" y="830">SIDE</text>

  <!-- ===== EXPRESSIONS ===== -->
  <text class="small" x="1060" y="130">EXPRESSIONS</text>
  <g filter="url(#sticker)" transform="translate(1150,160) scale(0.62)">
