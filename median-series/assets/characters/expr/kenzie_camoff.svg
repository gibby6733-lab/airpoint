<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="1310 148 205 205" width="410" height="410">
  <!-- MEDIAN — KENZIE VALE — reference sheet v02 -->
  <defs>
    <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grown"/>
      <feFlood flood-color="#FFFFFF"/><feComposite in2="grown" operator="in" result="rim"/>
      <feGaussianBlur in="grown" stdDeviation="4" result="soft"/>
      <feFlood flood-color="#C9B48F" flood-opacity="0.35"/><feComposite in2="soft" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="ringGlow"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFE6F0" stop-opacity="0"/></radialGradient>
    <style>
      .ol{stroke:#3A2420;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
      .skin{fill:#F4D3C4}.skinS{fill:#E2B3A0}.blush{fill:#F28CA0;opacity:.5}
      .hair{fill:#F3E6B8}.hairS{fill:#DCCB92}
      .brow{fill:#B79A6A}
      .puffer{fill:#F05A9A}.pufferS{fill:#D23F80}
      .tank{fill:#FFFFFF}.jean{fill:#A9C4DE}.jeanS{fill:#8EADCB}
      .shoe{fill:#FFFFFF}.sole{fill:#ECE6F0}
      .scrunch{fill:#FF8FC0}
      .dev{fill:#2B2D33}.ring{fill:none;stroke:#FFFFFF;stroke-width:7}
      .ink{fill:#2B1D1A}.white{fill:#FFFFFF}
      .label{font:700 26px 'Helvetica Neue',Arial,sans-serif;fill:#3A2A1E;letter-spacing:2px}
      .small{font:600 16px 'Helvetica Neue',Arial,sans-serif;fill:#7A6A58;letter-spacing:1px}
    </style>
    <g id="kenzieHead">
      <!-- ponytail (behind) -->
      <path class="hair ol" d="M40,70 Q140,44 150,130 Q156,200 120,250 Q132,186 112,140 Q96,104 50,100Z"/>
      <path class="hairS" d="M76,76 Q126,72 138,130 Q120,100 84,96Z"/>
      <rect class="scrunch ol" x="34" y="60" width="34" height="30" rx="12" transform="rotate(-20 51 75)"/>
      <rect class="skin ol" x="-102" y="66" width="204" height="218" rx="92"/>
      <!-- hair front, side part with swoop -->
      <path class="hair ol" d="M-104,178 Q-116,70 -10,60 Q100,56 106,170 Q94,120 50,108 Q20,100 -6,104 Q-40,120 -64,150 Q-86,170 -104,178Z"/>
      <path class="hairS" d="M-60,86 Q-20,68 30,72 Q-6,82 -36,108Z"/>
      <ellipse class="blush" cx="-62" cy="228" rx="18" ry="10"/><ellipse class="blush" cx="62" cy="228" rx="18" ry="10"/>
      <path class="skinS ol" stroke-width="2" d="M-9,206 Q0,224 9,206 Q7,218 0,220 Q-7,218 -9,206Z"/>
    </g>
    <g id="kenzieEyes">
      <ellipse class="white ol" cx="-42" cy="178" rx="31" ry="35"/><ellipse class="white ol" cx="42" cy="178" rx="31" ry="35"/>
    </g>
    <g id="kenzieLashes">
      <path class="ol" fill="none" stroke-width="4" d="M-70,160 l-12,-8 M-66,150 l-10,-12 M-58,144 l-6,-14 M70,160 l12,-8 M66,150 l10,-12 M58,144 l6,-14"/>
    </g>
  </defs>

  
  <text class="label" x="40" y="54">KENZIE VALE — MODEL SHEET v02</text>
  <text class="small" x="40" y="80">MEDIAN · locked design · height index 1.04 · line-up position 4 of 6 · twin rule: Kaylee = mint puffer, low ponytail, no phone</text>

  <!-- ===== FRONT ===== -->
  <g id="KENZIE-front" filter="url(#sticker)" transform="translate(330,120)">
    <!-- platform sneakers -->
    <rect class="sole ol" x="-80" y="638" width="76" height="24" rx="8"/><rect class="sole ol" x="4" y="638" width="76" height="24" rx="8"/>
    <path class="shoe ol" d="M-76,640 Q-76,612 -50,610 h40 q8,0 8,12 v18z"/><path class="shoe ol" d="M76,640 Q76,612 50,610 h-40 q-8,0 -8,12 v18z"/>
    <!-- wide-leg jeans -->
    <path class="jean ol" d="M-64,450 h58 l6,176 h-82z"/><path class="jean ol" d="M64,450 h-58 l-6,176 h82z"/>
    <path class="ol" fill="none" stroke="#7E9DBB" stroke-width="2.5" d="M-38,470 l-6,150 M38,470 l6,150"/>
    <rect class="jean ol" x="-66" y="440" width="132" height="26" rx="6"/><circle class="white ol" cx="0" cy="453" r="5" stroke-width="2"/>
    <!-- tank -->
    <rect class="tank ol" x="-62" y="296" width="124" height="150" rx="18"/>
    <!-- cropped puffer -->
    <path class="puffer ol" d="M-116,330 Q-120,290 -72,288 L-26,294 Q-30,350 -30,412 Q-70,420 -112,410 Q-122,370 -116,330Z"/>
    <path class="puffer ol" d="M116,330 Q120,290 72,288 L26,294 Q30,350 30,412 Q70,420 112,410 Q122,370 116,330Z"/>
    <path class="ol" fill="none" stroke-width="2.5" d="M-114,340 Q-72,350 -30,340 M-116,376 Q-72,386 -30,376 M114,340 Q72,350 30,340 M116,376 Q72,386 30,376"/>
    <path class="pufferS ol" d="M-90,286 Q0,262 90,286 Q74,306 30,302 L0,312 L-30,302 Q-74,306 -90,286Z"/>
    <!-- hand on hip (viewer right) -->
    <path class="puffer ol" d="M106,300 Q150,320 146,370 Q140,400 112,420 L88,396 Q110,380 112,356 Q110,334 96,330z"/>
    <path class="ol" fill="none" stroke-width="2.5" d="M132,330 Q118,350 122,370"/>
    <ellipse class="skin ol" cx="84" cy="420" rx="18" ry="16"/>
    <!-- phone arm raised (viewer left) -->
    <path class="puffer ol" d="M-104,300 Q-140,290 -150,250 L-162,200 Q-166,184 -150,180 Q-136,178 -132,194 L-122,240 Q-114,270 -92,286z"/>
    <path class="ol" fill="none" stroke-width="2.5" d="M-150,220 Q-136,226 -126,220 M-136,264 Q-122,270 -110,262"/>
    <ellipse class="skin ol" cx="-148" cy="172" rx="16" ry="18"/>
    <!-- ring-light phone -->
    <circle fill="url(#ringGlow)" cx="-150" cy="120" r="90"/>
    <rect class="dev ol" x="-176" y="72" width="52" height="92" rx="9" transform="rotate(8 -150 118)"/>
    <circle class="ring" cx="-150" cy="96" r="22" transform="rotate(8 -150 118)"/>
    <circle fill="#FFFFFF" cx="-150" cy="96" r="22" opacity=".25" transform="rotate(8 -150 118)"/>
    <!-- head + face -->
    <use xlink:href="#kenzieHead"/>
    <ellipse fill="#FFFFFF" opacity=".18" cx="-30" cy="190" rx="90" ry="80"/>
    <use xlink:href="#kenzieEyes"/><use xlink:href="#kenzieLashes"/>
    <circle class="ink" cx="-40" cy="182" r="11"/><circle class="ink" cx="44" cy="182" r="11"/>
    <circle class="white" cx="-36" cy="177" r="4"/><circle class="white" cx="48" cy="177" r="4"/>
    <path class="brow ol" stroke-width="2" d="M-74,128 Q-44,108 -14,124 L-16,132 Q-44,120 -72,136Z"/>
    <path class="brow ol" stroke-width="2" d="M74,128 Q44,108 14,124 L16,132 Q44,120 72,136Z"/>
    <path class="ink" d="M-34,238 Q0,250 34,238 Q30,272 0,272 Q-30,272 -34,238Z"/>
    <path class="white" d="M-28,240 Q0,250 28,240 v8 Q0,256 -28,248z"/>
    <path fill="#E87A8E" d="M-14,262 Q0,254 14,262 Q0,270 -14,262z"/>
  </g>
  <text class="small" x="300" y="830">FRONT</text>

  <!-- ===== SIDE (facing left) ===== -->
