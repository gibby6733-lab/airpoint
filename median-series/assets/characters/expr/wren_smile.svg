    <circle class="ink" cx="-36" cy="164" r="9"/><circle class="ink" cx="48" cy="164" r="9"/>
    <path class="skin" d="M-72,150 h60 v14 Q-42,160 -72,166Z"/><path class="skin" d="M72,150 h-60 v14 Q42,160 72,166Z"/>
    <path class="brow ol" stroke-width="2" d="M-74,138 Q-44,126 -14,136 L-14,146 Q-44,138 -74,148Z"/><path class="brow ol" stroke-width="2" d="M14,130 Q44,118 74,128 L72,138 Q44,130 16,142Z"/>
    <path class="ol" fill="none" d="M-22,252 Q0,246 24,240"/>
  </g><text class="small" x="1378" y="370">EYE-ROLL</text>
