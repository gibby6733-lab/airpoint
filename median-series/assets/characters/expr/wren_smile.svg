    <circle class="ink" cx="-42" cy="178" r="6"/><circle class="ink" cx="42" cy="178" r="6"/>
    <path class="brow ol" stroke-width="2" d="M-76,122 Q-44,108 -14,120 L-14,130 Q-44,120 -74,134Z"/><path class="brow ol" stroke-width="2" d="M76,122 Q44,108 14,120 L14,130 Q44,120 74,134Z"/>
