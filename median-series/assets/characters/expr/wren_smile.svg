<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="1320 458 205 205" width="410" height="410">
  <!-- MEDIAN — WREN OKAFOR — reference sheet v02 -->
  <defs>
    <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grown"/>
      <feFlood flood-color="#FFFFFF"/><feComposite in2="grown" operator="in" result="rim"/>
      <feGaussianBlur in="grown" stdDeviation="4" result="soft"/>
      <feFlood flood-color="#C9B48F" flood-opacity="0.35"/><feComposite in2="soft" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ol{stroke:#2A1E16;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
      .skin{fill:#7A4A2E}.skinS{fill:#5E3720}.blush{fill:#B5614E;opacity:.45}
      .hair{fill:#1E1A1A}.hairL{stroke:#4A4040;stroke-width:3;fill:none;stroke-linecap:round}
      .brow{fill:#140F0E}
      .jacket{fill:#5E6B3A}.jacketS{fill:#4A5530}
      .tee{fill:#A3A3A6}.jean{fill:#2A2A30}.jeanS{fill:#1C1C21}
      .shoe{fill:#7A4FA0}.shoeS{fill:#5E3A80}.sole{fill:#F1EDE6}
      .phones{fill:#FFFFFF}.phonesS{fill:#D9D9DE}
      .gold{fill:#E8C547}
      .ink{fill:#140F0E}.white{fill:#FFFFFF}
      .label{font:700 26px 'Helvetica Neue',Arial,sans-serif;fill:#3A2A1E;letter-spacing:2px}
      .small{font:600 16px 'Helvetica Neue',Arial,sans-serif;fill:#7A6A58;letter-spacing:1px}
    </style>
    <g id="wrenHead">
      <!-- bun (behind) -->
      <circle class="hair ol" cx="0" cy="34" r="54"/>
      <path class="hairL" d="M-40,20 Q0,0 40,20 M-46,40 Q0,18 46,40 M-38,62 Q0,44 38,62"/>
      <!-- head -->
      <rect class="skin ol" x="-102" y="72" width="204" height="214" rx="92"/>
      <!-- hair cap with braid lines -->
      <path class="hair ol" d="M-104,186 Q-114,74 0,68 Q114,74 104,186 Q94,128 0,120 Q-94,128 -104,186Z"/>
      <path class="hairL" d="M-70,128 Q-60,96 -30,80 M-36,122 Q-26,94 -8,76 M0,120 V74 M36,122 Q26,94 8,76 M70,128 Q60,96 30,80"/>
      <!-- loose front braids -->
      <g class="hair ol">
        <ellipse cx="-98" cy="160" rx="11" ry="14"/><ellipse cx="-99" cy="184" rx="11" ry="14"/><ellipse cx="-100" cy="208" rx="11" ry="14"/><ellipse cx="-101" cy="232" rx="11" ry="14"/><ellipse cx="-102" cy="256" rx="11" ry="14"/><ellipse cx="-103" cy="280" rx="10" ry="13"/>
        <ellipse cx="98" cy="160" rx="11" ry="14"/><ellipse cx="99" cy="184" rx="11" ry="14"/><ellipse cx="100" cy="208" rx="11" ry="14"/><ellipse cx="101" cy="232" rx="11" ry="14"/><ellipse cx="102" cy="256" rx="11" ry="14"/><ellipse cx="103" cy="280" rx="10" ry="13"/>
      </g>
      <rect class="gold ol" x="-111" y="290" width="16" height="10" rx="3" stroke-width="2"/>
      <rect class="gold ol" x="95" y="290" width="16" height="10" rx="3" stroke-width="2"/>
      <ellipse class="blush" cx="-60" cy="226" rx="17" ry="10"/><ellipse class="blush" cx="60" cy="226" rx="17" ry="10"/>
      <path class="skinS ol" stroke-width="2" d="M-11,204 Q0,224 11,204 Q8,218 0,220 Q-8,218 -11,204Z"/>
    </g>
    <g id="wrenEyes">
      <ellipse class="white ol" cx="-42" cy="180" rx="29" ry="30"/>
      <ellipse class="white ol" cx="42" cy="180" rx="29" ry="30"/>
    </g>
    <!-- half lids (default deadpan) -->
    <g id="wrenLids">
      <path class="skin" d="M-72,150 h60 v32 Q-42,174 -72,182Z"/><path class="ol" fill="none" d="M-72,180 Q-42,172 -12,180"/>
      <path class="skin" d="M72,150 h-60 v32 Q42,174 72,182Z"/><path class="ol" fill="none" d="M72,180 Q42,172 12,180"/>
    </g>
  </defs>

  
  <text class="label" x="40" y="54">WREN OKAFOR — MODEL SHEET v02</text>
  <text class="small" x="40" y="80">MEDIAN · locked design · height index 1.00 · line-up position 3 of 6</text>

