    <rect class="tee ol" x="-70" y="290" width="140" height="184" rx="20"/>
    <path class="jacket ol" d="M-110,316 Q-110,292 -74,290 L-22,296 L-30,480 h-72 q-10,0 -10,-12z"/>
    <path class="jacket ol" d="M110,316 Q110,292 74,290 L22,296 L30,480 h72 q10,0 10,-12z"/>
