    <path class="brow ol" stroke-width="2" d="M-84,150 Q-60,142 -36,148 L-36,158 Q-60,152 -84,160Z"/>
    <ellipse class="blush" cx="-40" cy="226" rx="15" ry="9"/>
    <path class="ol" fill="none" d="M-82,250 H-62"/>
  </g>
  <text class="small" x="740" y="830">SIDE</text>

  <!-- ===== EXPRESSIONS ===== -->
  <text class="small" x="1060" y="130">EXPRESSIONS</text>
  <g filter="url(#sticker)" transform="translate(1160,160) scale(0.62)">
    <use xlink:href="#wrenHead"/><use xlink:href="#wrenEyes"/>
    <circle class="ink" cx="-38" cy="190" r="9"/><circle class="ink" cx="46" cy="190" r="9"/><use xlink:href="#wrenLids"/>
    <path class="brow ol" stroke-width="2" d="M-74,150 Q-44,142 -14,148 L-14,158 Q-44,152 -74,160Z"/><path class="brow ol" stroke-width="2" d="M14,148 Q44,142 74,150 L74,160 Q44,152 14,158Z"/>
    <path class="ol" fill="none" d="M-20,250 H22"/>
  </g><text class="small" x="1124" y="370">DEADPAN</text>
