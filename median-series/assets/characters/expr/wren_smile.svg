    <path fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" d="M-10,300 Q-50,320 -64,296"/>
    <!-- bun -->
    <circle class="hair ol" cx="34" cy="40" r="52"/>
    <path class="hairL" d="M0,30 Q34,12 70,30 M-4,52 Q34,32 72,52"/>
    <!-- head profile -->
    <path class="skin ol" d="M-86,154 Q-96,76 -20,66 L50,66 Q104,70 104,156 L104,204 Q104,286 20,286 L-30,286 Q-70,286 -82,242 L-90,234 Q-106,224 -96,208 L-88,200 Z"/>
    <path class="skin ol" d="M-88,198 Q-112,192 -104,174 Q-96,166 -86,172"/>
    <ellipse class="skin ol" cx="28" cy="192" rx="16" ry="22"/>
    <path class="hair ol" d="M-86,158 Q-98,72 -10,64 Q96,60 106,150 Q110,210 98,240 Q88,170 46,152 Q-20,126 -86,158Z"/>
    <path class="hairL" d="M-50,120 Q-20,90 20,84 M-20,130 Q20,100 60,100 M20,140 Q60,120 90,130"/>
