    <path fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" d="M-76,288 Q0,330 76,288"/>
    <rect class="phones ol" x="-100" y="262" width="36" height="58" rx="16"/><rect class="phonesS" x="-92" y="274" width="14" height="34" rx="7"/>
    <rect class="phones ol" x="64" y="262" width="36" height="58" rx="16"/><rect class="phonesS" x="78" y="274" width="14" height="34" rx="7"/>
    <!-- head -->
