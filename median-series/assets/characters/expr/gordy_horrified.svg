    <circle class="ink" cx="-44" cy="186" r="12"/><circle class="ink" cx="44" cy="186" r="12"/>
    <circle class="white" cx="-40" cy="182" r="4"/><circle class="white" cx="48" cy="182" r="4"/>
    <use xlink:href="#gordyFrames"/>
    <path class="brow ol" stroke-width="2" d="M-82,134 Q-50,124 -20,140 L-22,150 Q-50,136 -80,146Z"/>
    <path class="brow ol" stroke-width="2" d="M82,134 Q50,124 20,140 L22,150 Q50,136 80,146Z"/>
    <path class="ink" d="M-22,252 Q0,248 22,252 Q18,272 0,272 Q-18,272 -22,252Z"/>
