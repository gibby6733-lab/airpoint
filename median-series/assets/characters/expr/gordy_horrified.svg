<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="1320 148 205 205" width="410" height="410">
  <!-- MEDIAN — GORDY BAKSHI — reference sheet v02 -->
  <defs>
    <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grown"/>
      <feFlood flood-color="#FFFFFF"/><feComposite in2="grown" operator="in" result="rim"/>
      <feGaussianBlur in="grown" stdDeviation="4" result="soft"/>
      <feFlood flood-color="#C9B48F" flood-opacity="0.35"/><feComposite in2="soft" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ol{stroke:#2C1F16;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
      .skin{fill:#A8724A}.skinS{fill:#8C5C38}.blush{fill:#C9685A;opacity:.45}
      .hair{fill:#1B1716}
      .brow{fill:#1B1716}
      .hat{fill:#C2B280}.hatS{fill:#A8986A}.lining{fill:#C8CDD2}
      .shirt{fill:#E2B33C}.shirtS{fill:#C99A28}
      .tee{fill:#2E3B5C}.planet{fill:#F0C24A}
      .cargo{fill:#8C8460}.cargoS{fill:#736C4C}
      .sock{fill:#FFFFFF}.shoe{fill:#9AA0A8}.velcro{fill:#4A4E56}.sole{fill:#E9E4DA}
      .lanyard{stroke:#F2C230;stroke-width:6;fill:none}.key{fill:#B8BCC2}
      .frame{fill:none;stroke:#1B1716;stroke-width:9}.lens{fill:#EAF4F8}
      .ink{fill:#1B1716}.white{fill:#FFFFFF}
      .label{font:700 26px 'Helvetica Neue',Arial,sans-serif;fill:#3A2A1E;letter-spacing:2px}
      .small{font:600 16px 'Helvetica Neue',Arial,sans-serif;fill:#7A6A58;letter-spacing:1px}
    </style>
    <g id="gordyHead">
      <ellipse class="skin ol" cx="-108" cy="200" rx="15" ry="20"/><ellipse class="skin ol" cx="108" cy="200" rx="15" ry="20"/>
      <rect class="skin ol" x="-106" y="70" width="212" height="216" rx="100"/>
      <!-- messy hair poking out under hat -->
      <path class="hair ol" d="M-104,186 L-116,170 L-100,164 L-114,146 L-94,146 L-98,124 L-70,136 L-60,120 L-44,138 L44,138 L60,120 L70,136 L98,124 L94,146 L114,146 L100,164 L116,170 L104,186 Q96,150 60,148 L-60,148 Q-96,150 -104,186Z"/>
      <!-- bucket hat -->
      <path class="hat ol" d="M-92,124 Q-90,34 0,30 Q90,34 92,124Z"/>
      <path class="hatS" d="M-80,112 Q-60,60 -20,46 Q-60,74 -66,112Z"/>
      <path class="lining ol" d="M-134,138 Q0,104 134,138 Q138,150 126,152 Q0,124 -126,152 Q-138,150 -134,138Z"/>
      <path class="hat ol" d="M-132,128 Q0,90 132,128 Q134,138 124,140 Q0,108 -124,140 Q-134,138 -132,128Z"/>
      <path class="ol" fill="none" stroke-width="2" stroke-dasharray="6 6" d="M-90,112 Q0,92 90,112"/>
      <ellipse class="blush" cx="-70" cy="236" rx="18" ry="10"/><ellipse class="blush" cx="70" cy="236" rx="18" ry="10"/>
      <path class="skinS ol" stroke-width="2" d="M-12,214 Q0,236 12,214 Q9,228 0,230 Q-9,228 -12,214Z"/>
    </g>
    <g id="gordyGlasses">
      <circle class="lens" cx="-48" cy="190" r="42"/><circle class="lens" cx="48" cy="190" r="42"/>
    </g>
    <g id="gordyFrames">
      <circle class="frame" cx="-48" cy="190" r="42"/><circle class="frame" cx="48" cy="190" r="42"/>
      <rect x="-12" y="180" width="24" height="16" rx="3" fill="#FFFFFF" stroke="#1B1716" stroke-width="2.5"/>
      <path stroke="#1B1716" stroke-width="7" d="M-90,186 h-14 M90,186 h14"/>
    </g>
  </defs>

  
  <text class="label" x="40" y="54">GORDY BAKSHI — MODEL SHEET v02</text>
  <text class="small" x="40" y="80">MEDIAN · locked design · height index 0.96 (roundest) · line-up position 2 of 6</text>

