    <!-- viewer-left arm raised, finger up -->
    <path class="skin ol" d="M-120,350 l-38,-70 q-6,-14 6,-20 q12,-6 18,8 l36,66z"/>
    <g transform="translate(-164,250) rotate(-20)">
