<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="1320 148 205 205" width="410" height="410">
  <!-- MEDIAN — LYLE "TUNK" TUNKETT — reference sheet v02 -->
  <defs>
    <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grown"/>
      <feFlood flood-color="#FFFFFF"/><feComposite in2="grown" operator="in" result="rim"/>
      <feGaussianBlur in="grown" stdDeviation="4" result="soft"/>
      <feFlood flood-color="#C9B48F" flood-opacity="0.35"/><feComposite in2="soft" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ol{stroke:#2E1E16;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
      .skin{fill:#E8B08E}.skinS{fill:#D08E6A}.blush{fill:#E8806E;opacity:.5}.nose{fill:#F08C86}
      .hair{fill:#9C4A2A}.stub{fill:#7C3820}.scar{fill:none;stroke:#F2D2BE;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .freck{fill:#B86A44}
      .brow{fill:#7C3820}
      .denim{fill:#5876A3}.denimS{fill:#46618A}.brass{fill:#C9A04A}
      .tee{fill:#F4F1EA}.stain{fill:#B08A5A;opacity:.55}
      .boot{fill:#4A5038}.bootS{fill:#3A3F2C}
      .ext{fill:#D23A32}.extS{fill:#A82A24}.metal{fill:#C4C8CC}
      .ink{fill:#2B1D15}.white{fill:#FFFFFF}
      .label{font:700 26px 'Helvetica Neue',Arial,sans-serif;fill:#3A2A1E;letter-spacing:2px}
      .small{font:600 16px 'Helvetica Neue',Arial,sans-serif;fill:#7A6A58;letter-spacing:1px}
    </style>
    <g id="tunkHead">
      <!-- big ears -->
      <ellipse class="skin ol" cx="-100" cy="196" rx="22" ry="28"/><ellipse class="skin ol" cx="100" cy="196" rx="22" ry="28"/>
      <ellipse class="skinS" cx="-100" cy="196" rx="10" ry="15"/><ellipse class="skinS" cx="100" cy="196" rx="10" ry="15"/>
      <rect class="skin ol" x="-92" y="70" width="184" height="216" rx="84"/>
      <!-- buzz cut -->
      <path class="hair ol" d="M-92,160 Q-100,72 0,66 Q100,72 92,160 Q88,124 60,116 Q0,106 -60,116 Q-88,124 -92,160Z"/>
      <g class="stub"><circle cx="-50" cy="90" r="2"/><circle cx="-20" cy="80" r="2"/><circle cx="14" cy="84" r="2"/><circle cx="44" cy="92" r="2"/><circle cx="-66" cy="112" r="2"/><circle cx="-30" cy="104" r="2"/><circle cx="6" cy="100" r="2"/><circle cx="34" cy="108" r="2"/><circle cx="66" cy="114" r="2"/></g>
      <!-- zig-zag scar on his left (viewer right) -->
      <path class="scar" d="M58,84 l10,10 l-8,8 l10,10 l-6,8"/>
      <!-- freckles + pink nose -->
      <g class="freck"><circle cx="-56" cy="224" r="3"/><circle cx="-44" cy="232" r="3"/><circle cx="-62" cy="236" r="2.5"/><circle cx="56" cy="224" r="3"/><circle cx="44" cy="232" r="3"/><circle cx="62" cy="236" r="2.5"/><circle cx="-14" cy="210" r="2.5"/><circle cx="14" cy="210" r="2.5"/></g>
      <ellipse class="blush" cx="-54" cy="232" rx="18" ry="10"/><ellipse class="blush" cx="54" cy="232" rx="18" ry="10"/>
      <ellipse class="nose ol" cx="0" cy="214" rx="11" ry="9" stroke-width="2.5"/>
    </g>
    <!-- small calm far-apart eyes -->
    <g id="tunkEyes">
      <ellipse class="white ol" cx="-50" cy="180" rx="19" ry="21"/><ellipse class="white ol" cx="50" cy="180" rx="19" ry="21"/>
    </g>
    <!-- mouth with missing front tooth -->
    <g id="tunkMouth">
      <path class="ink" d="M-26,248 Q0,254 26,248 Q22,268 0,268 Q-22,268 -26,248Z"/>
      <path class="white" d="M-22,250 Q0,255 22,250 v6 Q0,260 -22,256z"/>
      <rect class="ink" x="-1" y="250" width="9" height="9"/>
    </g>
    <g id="extinguisher">
      <rect class="ext ol" x="-20" y="0" width="40" height="96" rx="14"/>
      <rect class="extS" x="8" y="10" width="7" height="76" rx="3"/>
      <rect class="white ol" x="-12" y="34" width="24" height="26" rx="3" stroke-width="2"/>
      <rect class="metal ol" x="-10" y="-16" width="20" height="18" rx="4"/>
      <path class="metal ol" d="M-6,-16 l-22,-10 l4,-6 l26,10z"/>
      <path fill="none" stroke="#2E1E16" stroke-width="6" stroke-linecap="round" d="M8,-12 Q36,-10 30,30"/>
    </g>
  </defs>

  
  <text class="label" x="40" y="54">LYLE "TUNK" TUNKETT — MODEL SHEET v02</text>
  <text class="small" x="40" y="80">MEDIAN · locked design · height index 1.06 (lanky) · line-up position 5 of 6 · Object of the Week (Ep 101): fire extinguisher</text>

  <!-- ===== FRONT ===== -->
  <g id="TUNK-front" filter="url(#sticker)" transform="translate(330,120)">
    <!-- boots -->
    <path class="boot ol" d="M-62,560 h52 v90 h-60 q-14,0 -14,-12 q0,-14 16,-16z"/>
    <path class="boot ol" d="M62,560 h-52 v90 h60 q14,0 14,-12 q0,-14 -16,-16z"/>
    <rect class="bootS" x="-60" y="566" width="48" height="10"/><rect class="bootS" x="12" y="566" width="48" height="10"/>
    <!-- overall legs -->
    <rect class="denim ol" x="-60" y="450" width="52" height="124" rx="8"/><rect class="denim ol" x="8" y="450" width="52" height="124" rx="8"/>
    <!-- tee -->
    <rect class="tee ol" x="-64" y="290" width="128" height="176" rx="20"/>
    <circle class="stain" cx="-30" cy="320" r="9"/><circle class="stain" cx="40" cy="306" r="6"/><circle class="stain" cx="46" cy="318" r="4"/>
    <!-- overalls bib + waist -->
    <path class="denim ol" d="M-46,340 h92 v90 h16 v40 h-124 v-40 h16z"/>
    <rect class="denimS ol" x="-22" y="356" width="44" height="34" rx="4" stroke-width="2.5"/>
    <path class="ol" fill="none" stroke-width="2" stroke-dasharray="5 5" d="M-40,436 H40"/>
    <!-- strap on (his right = viewer left) -->
    <path class="denim ol" d="M-56,292 L-34,292 L-36,344 L-50,344z"/>
    <circle class="brass ol" cx="-42" cy="350" r="6" stroke-width="2"/>
    <!-- strap off, hanging (viewer right) -->
    <path class="denim ol" d="M36,344 L50,344 L70,420 L56,424z"/>
    <rect class="brass ol" x="54" y="420" width="18" height="14" rx="3" stroke-width="2"/>
    <circle class="brass ol" cx="40" cy="350" r="6" stroke-width="2"/>
    <!-- sleeves + long arms -->
    <path class="tee ol" d="M-62,300 Q-100,306 -100,350 L-64,352z"/><path class="tee ol" d="M62,300 Q100,306 100,350 L64,352z"/>
    <rect class="skin ol" x="-98" y="344" width="28" height="160" rx="13"/>
    <g class="freck"><circle cx="-86" cy="380" r="2.5"/><circle cx="-80" cy="410" r="2.5"/><circle cx="-88" cy="440" r="2.5"/></g>
    <ellipse class="skin ol" cx="-84" cy="516" rx="18" ry="22"/>
    <rect class="skin ol" x="70" y="344" width="28" height="140" rx="13"/>
    <!-- extinguisher in viewer-right hand -->
    <g transform="translate(96,470)"><use xlink:href="#extinguisher"/></g>
    <ellipse class="skin ol" cx="84" cy="490" rx="18" ry="20"/>
    <!-- head -->
    <use xlink:href="#tunkHead"/><use xlink:href="#tunkEyes"/>
    <circle class="ink" cx="-50" cy="182" r="7"/><circle class="ink" cx="50" cy="182" r="7"/>
    <path class="brow ol" stroke-width="2" d="M-70,148 Q-50,144 -30,148 L-30,154 Q-50,150 -70,154Z"/>
    <path class="brow ol" stroke-width="2" d="M70,148 Q50,144 30,148 L30,154 Q50,150 70,154Z"/>
    <use xlink:href="#tunkMouth"/>
  </g>
  <text class="small" x="300" y="830">FRONT</text>

  <!-- ===== SIDE (facing left) ===== -->
  <g id="TUNK-side" filter="url(#sticker)" transform="translate(760,120)">
    <path class="boot ol" d="M-30,560 h56 v90 h-92 q-14,0 -14,-12 q0,-16 18,-16 h32z"/>
    <rect class="bootS" x="-28" y="566" width="52" height="10"/>
    <rect class="denimS ol" x="-16" y="450" width="48" height="124" rx="8"/>
    <rect class="denim ol" x="-30" y="450" width="52" height="124" rx="8"/>
    <path class="tee ol" d="M-48,292 h86 q20,0 22,22 l4,154 h-118 l-6,-154 q0,-22 12,-22z"/>
    <circle class="stain" cx="-30" cy="320" r="8"/>
    <path class="denim ol" d="M-56,344 h30 v86 h80 v40 h-114z"/>
    <rect class="denimS ol" x="-54" y="356" width="22" height="30" rx="3" stroke-width="2.5"/>
    <path class="denim ol" d="M-40,292 L-22,292 L-30,346 L-46,346z"/>
    <circle class="brass ol" cx="-38" cy="352" r="6" stroke-width="2"/>
    <!-- long arm hanging with extinguisher -->
    <path class="tee ol" d="M-6,300 q30,0 32,26 l2,26 h-48 l0,-26 q0,-26 14,-26z"/>
    <rect class="skin ol" x="-14" y="346" width="28" height="144" rx="13"/>
    <g transform="translate(-6,476)"><use xlink:href="#extinguisher"/></g>
    <ellipse class="skin ol" cx="0" cy="496" rx="18" ry="20"/>
    <!-- head profile -->
    <path class="skin ol" d="M-80,160 Q-90,80 -16,70 L46,70 Q96,74 96,160 L96,206 Q96,286 16,286 L-28,286 Q-66,286 -76,242 L-84,234 Q-100,224 -90,208 L-82,200 Z"/>
    <ellipse class="nose ol" cx="-94" cy="190" rx="12" ry="10" stroke-width="2.5"/>
    <ellipse class="skin ol" cx="26" cy="196" rx="24" ry="30"/><ellipse class="skinS" cx="26" cy="196" rx="11" ry="16"/>
    <path class="hair ol" d="M-80,156 Q-88,72 10,66 Q94,66 98,150 Q98,176 94,190 Q84,140 50,128 Q-10,112 -80,156Z"/>
    <g class="stub"><circle cx="-40" cy="96" r="2"/><circle cx="0" cy="86" r="2"/><circle cx="40" cy="92" r="2"/><circle cx="70" cy="110" r="2"/><circle cx="-20" cy="112" r="2"/><circle cx="20" cy="108" r="2"/></g>
    <ellipse class="white ol" cx="-56" cy="180" rx="14" ry="20"/><circle class="ink" cx="-62" cy="182" r="6"/>
    <path class="brow ol" stroke-width="2" d="M-74,150 Q-56,146 -38,150 L-38,156 Q-56,152 -74,156Z"/>
    <g class="freck"><circle cx="-56" cy="222" r="3"/><circle cx="-44" cy="230" r="3"/><circle cx="-62" cy="234" r="2.5"/></g>
    <ellipse class="blush" cx="-46" cy="230" rx="15" ry="9"/>
    <path class="ink" d="M-84,246 Q-72,248 -60,246 Q-62,262 -78,262Z"/><rect class="white" x="-80" y="247" width="14" height="5"/>
  </g>
  <text class="small" x="740" y="830">SIDE</text>

  <!-- ===== EXPRESSIONS ===== -->
  <text class="small" x="1060" y="130">EXPRESSIONS</text>
  <g filter="url(#sticker)" transform="translate(1160,160) scale(0.62)">
    <use xlink:href="#tunkHead"/><use xlink:href="#tunkEyes"/>
    <circle class="ink" cx="-50" cy="182" r="7"/><circle class="ink" cx="50" cy="182" r="7"/>
    <path class="brow ol" stroke-width="2" d="M-70,148 Q-50,144 -30,148 L-30,154 Q-50,150 -70,154Z"/><path class="brow ol" stroke-width="2" d="M70,148 Q50,144 30,148 L30,154 Q50,150 70,154Z"/>
    <path class="ol" fill="none" d="M-16,252 H16"/>
  </g><text class="small" x="1132" y="370">BLANK</text>
  <g filter="url(#sticker)" transform="translate(1420,160) scale(0.62)">
    <use xlink:href="#tunkHead"/><use xlink:href="#tunkEyes"/>
    <circle class="ink" cx="-50" cy="180" r="7"/><circle class="ink" cx="50" cy="180" r="7"/>
    <path class="brow ol" stroke-width="2" d="M-70,140 Q-50,134 -30,140 L-30,146 Q-50,140 -70,146Z"/><path class="brow ol" stroke-width="2" d="M70,146 Q50,144 30,148 L30,154 Q50,150 70,152Z"/>
    <ellipse class="ink" cx="0" cy="254" rx="9" ry="8"/>
  </g><text class="small" x="1404" y="370">"HUH."</text>
  <g filter="url(#sticker)" transform="translate(1160,470) scale(0.62)">
    <use xlink:href="#tunkHead"/>
    <path class="ol" fill="none" stroke-width="5" d="M-66,184 Q-50,170 -34,184 M34,184 Q50,170 66,184"/>
    <path class="brow ol" stroke-width="2" d="M-70,148 Q-50,144 -30,148 L-30,154 Q-50,150 -70,154Z"/><path class="brow ol" stroke-width="2" d="M70,148 Q50,144 30,148 L30,154 Q50,150 70,154Z"/>
    <use xlink:href="#tunkMouth"/>
  </g><text class="small" x="1112" y="680">GAP SMILE</text>
  <g filter="url(#sticker)" transform="translate(1420,470) scale(0.62)">
    <use xlink:href="#tunkHead"/>
    <ellipse class="white ol" cx="-50" cy="180" rx="22" ry="24"/><ellipse class="white ol" cx="50" cy="180" rx="22" ry="24"/>
    <circle class="ink" cx="-50" cy="180" r="3.5"/><circle class="ink" cx="50" cy="180" r="3.5"/>
    <path class="brow ol" stroke-width="2" d="M-70,150 Q-50,150 -30,150 L-30,156 Q-50,156 -70,156Z"/><path class="brow ol" stroke-width="2" d="M70,150 Q50,150 30,150 L30,156 Q50,156 70,156Z"/>
    <path class="ol" fill="none" d="M-22,250 Q0,258 22,250"/>
  </g><text class="small" x="1370" y="680">UNSETTLING</text>

  
</svg>
